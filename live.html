<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AgentMesh</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#f5f6f8;--panel:#fff;--panel-2:#eef0f4;--text:#171a21;--muted:#6b7280;--border:#e2e5ea;--border-strong:#ccd2db;
 --accent:#3b5bdb;--accent-soft:#eaefff;--accent-fg:#fff;--ok:#2f9e44;--ok-soft:#e9f7ec;--warn:#c2570c;--warn-soft:#fff3e6;
 --danger:#d6336c;--danger-soft:#ffeaf1;--purple:#7048e8;--purple-soft:#f0ecff;--grey-dot:#adb5bd;
 --acc-wait:#64748b;--acc-work:#2563eb;--acc-ask:#d97706;--acc-review:#7c3aed;--acc-pending:#0e7490;--acc-done:#16a34a;--acc-cancel:#94a3b8;
 --dots:rgba(15,23,42,.055);--glow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);
 --radius:10px;--radius-sm:7px;--shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.10);--t:150ms}
[data-theme="dark"]{--bg:#0e1014;--panel:#161a20;--panel-2:#1b2027;--text:#e8eaee;--muted:#98a2b3;--border:#262c36;
 --border-strong:#3a424f;--accent:#5c7cfa;--accent-soft:#1c2540;--accent-fg:#fff;--ok:#51cf66;--ok-soft:#16281b;
 --warn:#ffa94d;--warn-soft:#2f2318;--danger:#ff6b81;--danger-soft:#331b24;--purple:#9775fa;--purple-soft:#241f3d;
 --grey-dot:#5c6672;--shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.45);
 --acc-wait:#94a3b8;--acc-work:#60a5fa;--acc-ask:#fbbf24;--acc-review:#a78bfa;--acc-pending:#22d3ee;--acc-done:#4ade80;--acc-cancel:#64748b;
 --dots:rgba(255,255,255,.045)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--bg:#0e1014;--panel:#161a20;
 --panel-2:#1b2027;--text:#e8eaee;--muted:#98a2b3;--border:#262c36;--border-strong:#3a424f;--accent:#5c7cfa;
 --accent-soft:#1c2540;--accent-fg:#fff;--ok:#51cf66;--ok-soft:#16281b;--warn:#ffa94d;--warn-soft:#2f2318;
 --danger:#ff6b81;--danger-soft:#331b24;--purple:#9775fa;--purple-soft:#241f3d;--grey-dot:#5c6672;
 --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.45);
 --acc-wait:#94a3b8;--acc-work:#60a5fa;--acc-ask:#fbbf24;--acc-review:#a78bfa;--acc-pending:#22d3ee;--acc-done:#4ade80;--acc-cancel:#64748b;
 --dots:rgba(255,255,255,.045)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.hidden{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:var(--muted)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
/* top bar */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}.brand .logo{color:var(--accent);font-size:15px}
.conn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--grey-dot)}
.conn.live{color:var(--ok);border-color:var(--ok)}.conn.live .dot{background:var(--ok)}
.conn.down{color:var(--danger);border-color:var(--danger)}.conn.down .dot{background:var(--danger)}
.badge-demo{margin-left:4px}
.topbar-mid{display:flex;align-items:center;gap:8px;flex:1 1 340px;min-width:220px}
.topbar-mid input[type=search]{flex:1 1 200px;min-width:120px}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.counts{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.counts b{color:var(--text);font-weight:600}.counts .warn{color:var(--warn)}.counts .purple{color:var(--purple)}
input[type=search],input[type=text],select,textarea{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;transition:border-color var(--t),box-shadow var(--t)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:64px;width:100%}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;transition:background var(--t),border-color var(--t),color var(--t)}
.btn:hover{background:var(--panel-2);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.danger:hover{background:var(--danger-soft)}
.btn.ghost{background:transparent;border-color:transparent}.btn.icon{padding:5px 8px}.btn.small{padding:2px 7px;font-size:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.seg button{background:var(--panel);border:0;padding:5px 9px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.check{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer}
/* layout */
:root{--rail-w:56px;--rail-expanded-w:252px}
body.rail-expanded{--rail-w:252px}
body.rail-collapsed{--rail-w:56px}
main{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:0;height:100%}
.rail{border-right:1px solid var(--border);background:var(--panel);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;transition:width var(--t),transform var(--t)}
.rail.slim{width:var(--rail-w);align-items:center;padding:8px 4px}
.rail.expanded{width:var(--rail-w)}
.rail-header{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.rail.slim .rail-header{justify-content:center;flex-direction:column}
.rail-avatar-list{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.rail-avatar-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.rail-avatar-btn{position:relative;background:transparent;border:1px solid transparent;border-radius:10px;padding:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.rail-avatar-btn:hover{background:var(--panel-2);border-color:var(--border)}
.rail-avatar-btn .status-dot{position:absolute;bottom:2px;right:6px;width:10px;height:10px;border:2px solid var(--panel);border-radius:50%}
.rail-count{font-size:10px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:0 4px;min-width:18px;text-align:center;line-height:1.4}
.rail-toggle{width:100%}
.rail .section{width:100%}
.rail h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0;font-weight:600}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:8px 9px;display:flex;flex-direction:column;gap:6px}
.card.clickable{cursor:pointer;transition:border-color var(--t),box-shadow var(--t)}
.card.clickable:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.agent-card{border-left:3px solid var(--card-accent,var(--border))}
.agent-card:hover{transform:translateY(-1px)}
.agent-card .row{display:flex;align-items:center;gap:8px}
.agent-card .id{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.agent-card .actions{display:flex;gap:6px;flex-wrap:wrap}
.btn.launch{border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.launch:hover{background:var(--ok-soft)}
.btn[disabled].launch{border-color:var(--border);color:var(--muted)}
.launcher{border-style:dashed;border-left:3px solid var(--border)}
.launcher .row{display:flex;align-items:center;gap:8px}
.agent-card .name{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.agent-card .name span.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-card .sub{font-size:11px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex:0 0 auto;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);user-select:none}
.avatar.sm{width:20px;height:20px;font-size:9px}.avatar.lg{width:38px;height:38px;font-size:15px}.avatar.xl{width:46px;height:46px;font-size:19px}
.avatar .avatar-emoji{font-size:1.15em;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-stack{display:inline-flex;align-items:center}
.avatar-stack .avatar{margin-left:-6px;box-shadow:0 0 0 2px var(--panel),inset 0 0 0 1.5px rgba(255,255,255,.35)}
.avatar-stack .avatar:first-child{margin-left:0}
.avatar-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch[aria-pressed=true]{border-color:var(--text);transform:scale(1.08)}
.emoji-grid{display:flex;flex-wrap:wrap;gap:3px;max-width:280px}
.emoji-grid button{background:var(--panel-2);border:1px solid var(--border);border-radius:7px;font-size:15px;line-height:1;padding:4px 5px}
.emoji-grid button:hover{border-color:var(--accent)}
.agent-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid var(--border);border-radius:9px;background:var(--panel)}
.agent-row .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.agent-row .id{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
.wload{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--panel-2);border:1px solid var(--border);min-width:70px;flex:1 1 70px}
.wload i{display:block;height:100%}
.wload i.s-backlog{background:var(--acc-wait)}.wload i.s-todo{background:var(--acc-wait)}.wload i.s-claimed,.wload i.s-in_progress{background:var(--acc-work)}
.wload i.s-blocked{background:var(--acc-ask)}.wload i.s-review{background:var(--acc-review)}
.wload i.s-pending_deploy{background:var(--acc-pending)}.wload i.s-done{background:var(--acc-done)}.wload i.s-cancelled{background:var(--acc-cancel)}
.rail-filter{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip-avatar{background:transparent;border:2px solid transparent;border-radius:50%;padding:1px;line-height:0}
.chip-avatar[aria-pressed=true]{border-color:var(--accent)}
.timer{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.tile-time{font-size:11px;color:var(--muted);margin-left:4px}
.tile-foot .trunc{flex:0 1 auto}
.timer.stale{color:var(--warn);font-weight:600}
.tile{position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,var(--border))}
.tile[data-status=backlog]{--acc:var(--acc-wait)}.tile[data-status=todo]{--acc:var(--acc-wait)}.tile[data-status=claimed],.tile[data-status=in_progress]{--acc:var(--acc-work)}
.tile[data-status=blocked]{--acc:var(--acc-ask)}.tile[data-status=review]{--acc:var(--acc-review)}
.tile[data-status=pending_deploy]{--acc:var(--acc-pending)}.tile[data-status=done]{--acc:var(--acc-done)}.tile[data-status=cancelled]{--acc:var(--acc-cancel)}
.tile.mine{border-left-color:var(--accent)}
@keyframes tileIn{from{opacity:0;transform:translateY(-7px) scale(.98)}}
@keyframes tileFlash{0%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes evIn{from{opacity:0;transform:translateX(6px)}}
.tile-enter{animation:tileIn 230ms ease-out}
.tile-flash{animation:tileFlash 900ms ease-out}
.event-enter{animation:evIn 220ms ease-out}
body.compact .tile{padding:6px 8px;gap:4px}
body.compact .col-body{gap:6px;padding:6px}
body.compact .card{padding:6px 8px}
body.compact .agent-card .actions .btn{padding:1px 5px;font-size:10.5px}
body.compact .toolbar,body.compact .col-head{padding-top:4px;padding-bottom:4px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--grey-dot);flex:0 0 auto}
.st-backlog{background:var(--acc-wait)}.st-todo{background:var(--acc-wait)}.st-claimed,.st-in_progress{background:var(--acc-work)}.st-blocked{background:var(--acc-ask)}
.st-review{background:var(--acc-review)}.st-pending_deploy{background:var(--acc-pending)}.st-done{background:var(--acc-done)}.st-cancelled{background:var(--acc-cancel);opacity:.6}
.status-dot{width:9px;height:9px}
.beat{animation:beat 2.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.6}}
.conn.live .dot{animation:beat 2.6s ease-in-out infinite}
.lock{display:flex;align-items:center;gap:6px;font-size:11px}
.lock .path{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
/* board */
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:12px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel)}
.needs{display:flex;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--accent-soft);overflow-x:auto;align-items:center}
.needs .needs-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);flex:0 0 auto}
.need{flex:0 0 auto;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color var(--t)}
.need{border-left:3px solid var(--need-accent,var(--accent))}
.need:hover{border-color:var(--need-accent,var(--accent))}.need.warning{--need-accent:var(--warn)}
@keyframes pop{from{opacity:.5;transform:translateY(6px) scale(.985)}}
.board{flex:1 1 auto;min-height:0;display:flex;gap:10px;overflow:auto;padding:10px;align-items:stretch;background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px}
.board.lanes{flex-direction:column;gap:10px}
.board-row{flex:1 1 auto;display:flex;gap:10px;align-items:stretch;min-height:0;min-width:0}
.col{flex:0 0 272px;width:272px;display:flex;flex-direction:column;min-height:0;max-height:100%;background:var(--panel-2);border:1px solid var(--border);border-top:3px solid var(--col-accent,var(--border));border-radius:var(--radius);transition:box-shadow var(--t),outline-color var(--t)}
.col[data-colkey=backlog]{--col-accent:var(--acc-wait)}.col[data-colkey=todo]{--col-accent:var(--acc-wait)}.col[data-colkey=working]{--col-accent:var(--acc-work)}
.col[data-colkey=blocked]{--col-accent:var(--acc-ask)}.col[data-colkey=review]{--col-accent:var(--acc-review)}
.col[data-colkey=pending_deploy]{--col-accent:var(--acc-pending)}.col[data-colkey=done]{--col-accent:var(--acc-done)}.col[data-colkey=cancelled]{--col-accent:var(--acc-cancel)}
.col-head{border-bottom:1px solid var(--border)}
.col.narrow{flex:0 0 216px;width:216px}
.col-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border)}
.col-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--col-accent,var(--muted))}
.col-count{margin-left:auto;font-size:11px;color:var(--col-accent,var(--muted));background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:0 7px;font-weight:600}
.col-body{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:34px}
.empty{color:var(--muted);font-size:12px;padding:8px 2px;border:1px dashed var(--border);border-radius:var(--radius-sm);text-align:center}
.lane{border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);margin:0 10px 10px;flex:0 0 auto}
.lane-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border)}
.lane-cols{display:flex;gap:10px;padding:8px;overflow:auto}
.lane-cols .col{background:var(--panel-2);max-height:min(62vh,460px)}
.lane-cols .col .col-body{overflow:auto}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 9px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;transition:border-color var(--t),box-shadow var(--t)}
.tile:hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.tile:active{transform:translateY(0) scale(.995)}.tile.dragging{opacity:.45;transform:rotate(.6deg)}
.tile .status-dot{margin-top:0}
.cancel-strip{display:none;margin:0 10px 10px;border:2px dashed var(--danger);border-radius:var(--radius);padding:10px 12px;text-align:center;color:var(--danger);background:var(--danger-soft);font-weight:600;font-size:12px;transition:background var(--t),color var(--t),transform var(--t)}
body.is-dragging .cancel-strip{display:block;animation:pop 160ms ease-out}
.cancel-strip.over{background:var(--danger);color:#fff;transform:scale(1.01)}
.tile-top{display:flex;align-items:center;gap:6px}
.tile-id{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.tile-menu-btn{margin-left:auto;background:transparent;border:0;color:var(--muted);border-radius:5px;padding:0 5px;line-height:1.2}
.tile-menu-btn:hover{background:var(--panel-2);color:var(--text)}
.tile-title{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:0 6px;color:var(--muted);background:var(--panel-2);white-space:nowrap}
.badge.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.badge.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.badge.purple{color:var(--purple);border-color:var(--purple);background:var(--purple-soft)}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.badge.time{font-variant-numeric:tabular-nums}
.settings-tabs{display:flex;gap:6px;flex-wrap:wrap}
.settings-tabs .btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.status-pill{font-weight:600}
.status-pill.st-backlog{color:var(--acc-wait)}.status-pill.st-claimed,.status-pill.st-in_progress{color:var(--acc-work)}
.status-pill.st-blocked{color:var(--acc-ask)}.status-pill.st-review{color:var(--acc-review)}
.status-pill.st-pending_deploy{color:var(--acc-pending)}.status-pill.st-done{color:var(--acc-done)}.status-pill.st-cancelled{color:var(--acc-cancel)}
.tile.mine{border-style:solid;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--accent-soft)}
.drop-valid{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft);box-shadow:var(--glow)}
.drop-invalid{cursor:not-allowed;opacity:.55}
.tile.shake{animation:shake 220ms ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* activity */
.activity{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:70;transform:translateX(101%);transition:transform var(--t);box-shadow:var(--shadow);border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.activity.open{transform:translateX(0)}
.activity-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border)}
.activity-feed{overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:10px}
.activity-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:69;display:none}
.activity-backdrop.open{display:block}
.btn.has-dot{position:relative}
.btn .dot-new{position:absolute;top:1px;right:1px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--panel);display:inline-block}
#locksBtn{font-variant-numeric:tabular-nums}
.event{display:flex;flex-direction:column;gap:2px;font-size:12px}
.event .meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px}
.event .msg{color:var(--text);overflow-wrap:anywhere}
.badge-type{width:6px;height:6px;border-radius:50%;background:var(--grey-dot)}
.bt-success{background:var(--ok)}.bt-warning{background:var(--warn)}.bt-purple{background:var(--purple)}.bt-info{background:var(--accent)}
/* dialogs */
.backdrop{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:60}
.dialog{animation:pop 150ms ease-out;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:min(720px,100%);max-height:min(90vh,900px);display:flex;flex-direction:column;overflow:hidden}
.dialog.wide{width:min(900px,100%)}.dialog.small{width:min(430px,100%)}
.dialog-head{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 10px;border-bottom:1px solid var(--border)}
.dialog-head .head-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.dialog-title{margin:0;font-size:15px;font-weight:650;overflow-wrap:anywhere}
.dialog-sub{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dialog-body{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.dialog-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;background:var(--panel-2)}
.dialog-foot:empty{display:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);font-weight:550}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:5px}
.section>h3{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px;max-height:280px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
ul.plain{margin:0;padding-left:18px}ul.plain li{overflow-wrap:anywhere}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.meta{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12px;overflow-wrap:anywhere}
.meta b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px}.field>label,.field label{font-weight:600}
.field .hint{color:var(--muted);font-size:11px}.field .err{color:var(--danger);font-size:11px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}
.timeline{display:flex;flex-direction:column;gap:9px}
.tl-item{border-left:2px solid var(--border);padding:0 0 0 10px;display:flex;flex-direction:column;gap:2px}
.tl-item .tl-meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px}
.welcome{margin:18px auto;max-width:480px;text-align:center;padding:22px 20px;border:1px dashed var(--border-strong);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:9px;align-items:center}
.welcome .big{font-size:30px;color:var(--accent);line-height:1}
.welcome h3{margin:0;font-size:15px}
.welcome p{margin:0;font-size:12px;line-height:1.5}
.notice{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;background:var(--panel-2)}
.notice.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.notice.danger{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.notice.purple{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}
.notice.amber{border-color:var(--warn);background:var(--warn-soft)}
.message{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
/* menus, toasts */
.menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:5px;min-width:206px;display:flex;flex-direction:column;gap:2px}
.menu button{background:transparent;border:0;text-align:left;padding:6px 8px;border-radius:6px;font-size:12px}
.menu button:hover{background:var(--panel-2)}
.menu .menu-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:4px 8px 2px;font-weight:700}
.menu .menu-sep{height:1px;background:var(--border);margin:3px 0}
#toasts{position:fixed;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,90vw)}
.toast{animation:pop 160ms ease-out;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;box-shadow:var(--shadow);padding:8px 11px;font-size:12px;opacity:1;transition:opacity var(--t),transform var(--t)}
.toast.out{opacity:0;transform:translateY(4px)}
.toast.error{border-left-color:var(--danger)}.toast.success{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}
/* responsive */
@media (max-width:800px){
  :root{--rail-w:0px}
  main{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:0;left:0;bottom:0;width:min(280px,86vw);z-index:65;transform:translateX(-101%);box-shadow:var(--shadow);border-right:1px solid var(--border)}
  .rail.open{transform:none}
  .rail.slim{width:min(280px,86vw);align-items:flex-start}
  .rail.slim .rail-avatar-list{flex-direction:column;align-items:stretch}
  .rail.slim .rail-avatar-item{flex-direction:row;justify-content:flex-start}
  .rail.slim .rail-avatar-btn{flex-direction:row;justify-content:flex-start;padding:6px 8px}
  #railToggle{display:inline-flex!important}
  .board{scroll-snap-type:x proximity}
  .col{flex:0 0 84vw;width:84vw;scroll-snap-align:start}
  .lane-cols .col{flex:0 0 78vw;width:78vw}
}
@media (min-width:801px){
  #railToggle{display:none}
}
@media (max-width:1200px){
  /* activity already drawer, keep */
}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}}

.tile-type.t-story{background:var(--purple-soft);border-color:var(--purple);color:var(--purple)}
.tile-type.t-bug{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.tile-type.t-feature{background:var(--panel-2);border-color:var(--border);color:var(--text)}

.tile-owner .state-dot.idle{background:var(--acc-done)}
.tile-owner .state-dot.offline{background:var(--grey-dot)}
.tile-labels{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tile-labels .lbl{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tile-chip{font-size:10.5px;padding:2px 6px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);display:inline-flex;align-items:center;gap:3px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-chip.story-chip{background:var(--purple-soft);border-color:var(--purple);color:var(--purple);cursor:pointer;font-weight:600}
.tile-chip.story-chip:hover{background:var(--purple);color:#fff}
.tile-chip.dep-chip{background:var(--panel-2);border-color:var(--border);color:var(--muted)}
.tile-chip.dep-chip.unmet{opacity:.6;text-decoration:line-through}
.tile-chip.dep-chip.met{color:var(--text);border-color:var(--border-strong)}
.tile-chip.warn-chip{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.tile-chip.handover-btn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;cursor:pointer;padding:2px 8px}
.tile-chip.handover-btn:hover{background:var(--accent);color:#fff}
.tile-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.tile-time{font-size:10.5px}
.story-progress{height:4px;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin:2px 0}
.story-progress i{display:block;height:100%;background:var(--purple);transition:width 200ms}
.story-meta{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.story-meta .mode{font-size:10px;padding:1px 5px;border-radius:999px;background:var(--panel-2);border:1px solid var(--border)}
.story-toggle{background:transparent;border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:10.5px;color:var(--muted);cursor:pointer}
.story-toggle:hover{background:var(--panel-2);color:var(--text)}
.story-subtasks{display:flex;flex-direction:column;gap:4px;margin-top:4px;padding-left:6px;border-left:2px solid var(--border)}
.story-subtasks .subtask-row{display:flex;align-items:center;gap:5px;font-size:11px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:3px 6px;cursor:pointer}
.story-subtasks .subtask-row:hover{border-color:var(--border-strong);background:var(--panel)}
.story-subtasks .subtask-row .st-id{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted)}
.story-subtasks .subtask-row .st-title{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-subtasks .subtask-row .st-status{font-size:9px;padding:1px 4px;border-radius:999px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
.tile{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
.badge{color:var(--text)}
.badge.warn{color:#7a4a00;background:#fff3cd;border-color:#d4a017}
.badge.danger{color:#7a1a1a;background:#fde2e2;border-color:#c94a4a}

.badge.ok{color:#1a5a2a;background:#d4edda;border-color:#4a9a5a}
.handover-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.handover-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer}

.handover-item .h-state.busy{background:var(--acc-work)}
.handover-item .h-state.offline{background:var(--grey-dot)}
.story-lane{border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);margin:0 10px 10px;flex:0 0 auto}

.story-lane-body{display:flex;gap:8px;padding:8px;overflow:auto;flex-wrap:wrap}

<body>
<header class="topbar">
  <div class="brand">
    <button id="railToggle" class="btn icon" aria-label="Toggle team rail" title="Team (T)">☰</button>
    <span class="logo" aria-hidden="true">◆</span><span>AgentMesh</span>
    <span id="conn" class="conn"><span class="dot" aria-hidden="true"></span><span id="connText">connecting…</span></span>
    <span id="demoBadge" class="badge badge-demo hidden">DEMO — not connected</span>
  </div>
  <div class="topbar-mid">
    <input id="search" type="search" placeholder="Search tasks…  ( / )" aria-label="Search tasks by id, title, agent or brief">

  </div>
  <div class="topbar-right">
    <span id="counts" class="counts"></span>
    <button id="locksBtn" class="btn small hidden" aria-label="File locks" title="File locks">🔒 0</button>
    <button id="newTaskBtn" class="btn primary" title="New task (N)">+ New task</button>
    <button id="themeBtn" class="btn icon" aria-label="Theme: auto" title="Theme">◐</button>

      <button id="groupStatus" data-group="status" aria-pressed="true">Status</button>
      <button id="groupAgent" data-group="agent" aria-pressed="false">Agent</button>
      <button id="groupStory" data-group="story" aria-pressed="false">Story</button>
    </div>
    <button id="settingsBtn" class="btn icon" aria-label="Settings: team, avatars and appearance" title="Settings">⚙</button>
    <button id="activityToggle" class="btn icon has-dot" aria-label="Toggle activity feed" title="Activity (A)"><span>☰</span><span id="activityDot" class="dot-new hidden"></span></button>

</header>
<div id="activityBackdrop" class="activity-backdrop"></div>
<main>
  <aside class="rail" id="rail" aria-label="Team and file locks"></aside>
  <section class="center">
    <div class="toolbar">
      <span class="muted">Board</span>

    <div class="activity-feed" id="activityFeed"></div>
  </aside>
</main>

<script>'use strict';
(function () {
  /* 0. environment */
  var DEMO = false;
  try { DEMO = new URLSearchParams(location.search).get('demo') === '1'; } catch (e) { DEMO = false; }

  /* 1. small helpers (createElement / textContent only — no innerHTML ever) */
  function el(tag, props) {
    var n = document.createElement(tag), k, v;
    if (props) for (k in props) {
      v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = String(v);
      else if (k === 'dataset') { for (var d in v) if (v[d] !== null && v[d] !== undefined) n.dataset[d] = String(v[d]); }
      else if (k === 'style' && typeof v === 'object') { for (var s in v) n.style[s] = v[s]; }
      else if (k === 'value' && n.tagName === 'TEXTAREA') n.value = String(v); // the value attribute does nothing for a textarea
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else n.setAttribute(k, String(v));
    }
    for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
    return n;
  }
  function add(parent, kid) {
    if (kid === null || kid === undefined || kid === false || kid === '') return;
    if (Array.isArray(kid)) { for (var i = 0; i < kid.length; i++) add(parent, kid[i]); return; }
    if (kid instanceof Node) { parent.appendChild(kid); return; }
    parent.appendChild(document.createTextNode(String(kid)));
  }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
  function replace(node) {
    clear(node);
    for (var i = 1; i < arguments.length; i++) add(node, arguments[i]);
    return node;
  }
  function setText(node, txt) { if (node && node.textContent !== String(txt)) node.textContent = String(txt); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  /* ---- time ---- */
  function tms(iso) { if (!iso) return null; var t = Date.parse(iso); return isNaN(t) ? null : t; }
  function agoText(iso) {
    var t = tms(iso);
    if (t === null) return '';
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return Math.round(s) + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    if (s < 604800) return Math.round(s / 86400) + 'd ago';
    return new Date(t).toLocaleDateString();
  }
  function agoNode(iso, cls) { return el('span', { class: cls || 'ago', dataset: { ago: iso || '' }, text: agoText(iso) }); }
  function clockText(iso) { var t = tms(iso); return t === null ? '' : new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function durationText(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ' + (m % 60) + 'm';
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  }
  function refreshTimes() {
    var agos = document.querySelectorAll('[data-ago]');
    for (var i = 0; i < agos.length; i++) setText(agos[i], agoText(agos[i].dataset.ago));
    var since = document.querySelectorAll('[data-since]');
    for (var j = 0; j < since.length; j++) {
      setText(since[j], '⏱ ' + durationText(Date.now() - Number(since[j].dataset.since)));
      var limit = Number(since[j].dataset.staleAt || 0);
      if (limit) since[j].classList.toggle('stale', Date.now() - Number(since[j].dataset.since) > limit);
    }
  }
  window.setInterval(refreshTimes, 5000);
  /* ---- identity ---- */
  function hueOf(id) { var h = 0, s = String(id || '?'); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function initialsOf(name) {
    var s = String(name || '?').replace(/[^A-Za-z0-9]+/g, ' ').trim();
    if (!s) return '?';
    var p = s.split(' ');
    return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }
  function avatarCfg(agentId) { return AV[agentId] || {}; }
  function avatarColor(agentId) {
    var cfg = avatarCfg(agentId);
    return cfg.color || ('hsl(' + hueOf(agentId || '?') + ' 56% 44%)');
  }
  function avatarNode(agentId, cls) {
    var a = agentById(agentId);
    var label = a ? (a.displayName || a.id) : (agentId || '?');
    var cfg = avatarCfg(agentId);
    var node = el('span', { class: 'avatar ' + (cls || ''), title: label, 'aria-hidden': 'true', style: { background: avatarColor(agentId) } });
    if (cfg.img) node.appendChild(el('img', { src: cfg.img, alt: '' }));
    else if (cfg.emoji) node.appendChild(el('span', { class: 'avatar-emoji', text: cfg.emoji }));
    else node.appendChild(el('span', { text: initialsOf(label) }));
    return node;
  }
  /* ---- toasts ---- */
  function toast(msg, kind) {
    var t = el('div', { class: 'toast ' + (kind || ''), role: 'status' }, el('span', { text: msg }));
    var wrap = $('#toasts');
    wrap.appendChild(t);
    window.setTimeout(function () {
      t.classList.add('out');
      window.setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 220);
    }, kind === 'error' ? 6500 : 3800);
  }
  /* ---- overlays (stack, Esc, focus trap) ---- */
  var overlays = [];

          class: 'btn primary', text: 'Submit for review', onclick: function () {
            if (!paste.value.trim()) { toast('Paste the response first', 'error'); paste.focus(); return; }
            T.forceNext = true;
            api('/api/mesh/task/' + encodeURIComponent(t.id) + '/response', { text: paste.value }).then(function (r) {
              if (r) { T.pasteOpen = false; if (DEMO) push(); }
            });
          }
        }));
        out.push(el('button', { class: 'btn', text: 'Never mind', onclick: function () { T.pasteOpen = false; updateTaskModal(true); } }));
      } else {
        out.push(el('button', {
          class: 'btn primary', text: 'Paste response…', onclick: function () {
            T.pasteOpen = true; updateTaskModal(true);
            window.setTimeout(function () { try { paste.focus(); } catch (e) { } }, 30); }
        }));
      }
      if (t.status !== 'review' && t.status !== 'blocked') out.push(moveMenuButton(t, 'Move to…'));
    }
    if (!hasFinal && !isManual(t.assignee || t.assignedIDE) && t.status === 'backlog') {
      // a waiting task reserved for a launchable agent, or free for any of them
      var res = t.assignee ? agentById(t.assignee) : null;
      if (res && !res.manual && res.launch && !res.launch.running) out.push(el('button', {
        class: 'btn primary', text: '▶ Run ' + (res.launch.label || res.id) + ' to start this task',
        onclick: function () { runAgent(res.id); } }));
      else if (!t.assignee) out.push(runAgentMenuButton(t));
    }
    if (!hasFinal) {
      if (canRelease(t)) out.push(el('button', { class: 'btn', text: 'Release to Waiting', title: 'Take it back from the agent; it stays reserved for the same agent', onclick: function () { doRelease(t); } }));
      out.push(el('button', { class: 'btn', text: 'Hand over...', onclick: function(){ openHandover(t.id); } }));
      out.push(el('button', { class: 'btn', text: 'Edit', onclick: function () { setTaskTab('edit'); } }));
      if (t.status !== 'review') {
        out.push(el('button', {
          class: 'btn danger', text: 'Cancel task',
          onclick: function () { doCancel(t); }
        }));
      }
    } else {
      out.push(el('span', { class: 'muted', style: { alignSelf: 'center' }, text: t.status === 'done' ? 'Done — read-only.' : 'Cancelled — read-only.' }));
    }
    return out;
  }
  function startSendBack() { T.sendBack = true; T.tab = 'overview'; updateTaskModal(true); }
  function moveMenuButton(t, label) {
    var btn;
    btn = el('button', { class: 'btn', text: label, 'aria-haspopup': 'menu', onclick: function () { openMoveMenu(t, btn); } });
    return btn;
  }
  function runAgentMenuButton(t) {
    var btn;
    btn = el('button', {
      class: 'btn primary', text: '▶ Run an agent…', 'aria-haspopup': 'menu',
      onclick: function () {
        var list = runnableAgents();
        if (!list.length) { toast('No agent can be started from the board right now', 'warn'); return; }
        openMenu(btn, 'Start an agent for ' + t.id, list.map(function (a) {
          return { label: '▶ Run ' + (a.launch ? a.launch.label : a.id) + (t.assignee ? '' : ' (any agent)'), run: function () { runAgent(a.id); } };
        }));
      }
    });
    return btn;
  }
  function canRelease(t) {
    return !isManual(t.assignee || t.assignedIDE) && (t.status === 'claimed' || t.status === 'in_progress' || t.status === 'blocked');
  }
  function doRelease(t) {
    var who = agentName(t.assignedIDE || t.assignee);
    uiConfirm({
      title: 'Release ' + t.id + '?',
      message: 'It goes back to Waiting, still reserved for ' + who + '. Use this when the agent is stuck or holding it while other work waits.',
      confirmLabel: 'Release to Waiting'
    }).then(function (ok) {

      api('/api/mesh/task/' + encodeURIComponent(t.id) + '/release', {}).then(function (r) { if (r && DEMO) push(); });
    });
  }
  function doCancel(t) {
    uiConfirm({
      title: 'Cancel ' + t.id + '?',
      message: 'The agent will be told to stop. This cannot be undone.',
      confirmLabel: 'Cancel task', danger: true
    }).then(function (ok) {
      if (!ok) return;
      uiPrompt({ title: 'Reason (optional)', label: 'Why is this task cancelled?', required: false, confirmLabel: 'Cancel task' })
        .then(function (reason) {
          api('/api/mesh/task/' + encodeURIComponent(t.id) + '/cancel', { reason: reason || '' })
            .then(function (r) { if (r && DEMO) push(); });

    });
  }
  function copyText(text, label) {
    function fallback() { try { window.prompt('Copy this text (select all, then copy):', text); } catch (e) { toast('Could not copy automatically', 'error'); } }

        navigator.clipboard.writeText(text).then(function () { toast((label || 'Text') + ' copied to the clipboard', 'success'); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }
  function startPromptFor(id) {
    return 'Join AgentMesh as WORKER with agent_id ' + id + '. Call mesh_register_agent, then call mesh_wait_for_task repeatedly until a task arrives, and follow its brief exactly. Never commit, push or deploy unless the brief says so. Do not run any dispatch script.';
  }

  /* 7. new task modal */
  function openNewTask() {
    var newest = S.tasks.slice().sort(function (a, b) { return (tms(b.updatedAt) || 0) - (tms(a.updatedAt) || 0); })[0];
    var defaultWs = (newest && newest.workspacePath) || S.workspacePath || '';
    var titleIn = el('input', { type: 'text', name: 'title' });
    var briefIn = el('textarea', { rows: '8', name: 'brief' });

    var forbiddenIn = el('textarea', { rows: '4', name: 'forbiddenFiles' });

      el('option', { value:'docs', text:'docs' }),
      el('option', { value:'refactor', text:'refactor' }),
      el('option', { value:'research', text:'research' }),
      el('option', { value:'deploy', text:'deploy' }),
      el('option', { value:'story', text:'story' })
    ]);
    var prioritySel = el('select', { name:'priority' }, [
      el('option', { value:'low', text:'low' }),
      el('option', { value:'normal', text:'normal', selected:'true' }),
      el('option', { value:'high', text:'high' }),
      el('option', { value:'urgent', text:'urgent' })
    ]);
    var labelsIn = el('input', { type:'text', name:'labels', placeholder:'comma separated, max 5, e.g. ai, board' });
    var modeSel = el('select', { name:'mode' }, [
      el('option', { value:'parallel', text:'parallel' }),
      el('option', { value:'sequential', text:'sequential' })

    var deployCheck = el('input', { type: 'checkbox', id: 'newTaskDeploy' });
    var noDeployCheck = el('input', { type: 'checkbox', id: 'newTaskNoDeploy' });
    deployCheck.addEventListener('change', function(){ if (deployCheck.checked) noDeployCheck.checked = false; });
    noDeployCheck.addEventListener('change', function(){ if (noDeployCheck.checked) deployCheck.checked = false; });
    var err = el('div', { class: 'field err hidden' });
    var subtaskContainer = el('div', { class:'section' });
    var subtasks = [];
    function renderSubtasks(){
      var rows = [];
      rows.push(el('div', { class:'muted', style:{fontSize:'11px'}, text:'Subtasks for story — title, assignee, dependsOn picker among other rows' }));
      subtasks.forEach(function(st, idx){
        var titleI = el('input', { type:'text', placeholder:'Subtask title', value: st.title||'' });
        titleI.addEventListener('input', function(){ st.title = titleI.value; });
        var assI = el('input', { type:'text', placeholder:'assignee (optional)', list:'agentIds', value: st.assignee||'' });
        assI.addEventListener('input', function(){ st.assignee = assI.value; });
        var depOptions = [el('option', { value:'', text:'no dependency' })];
        subtasks.forEach(function(other, oIdx){
          if (oIdx===idx) return;
          if (!other.title) return;
          depOptions.push(el('option', { value: String(oIdx), text: other.title.slice(0,24) }));
        });
        var depSel = el('select', {}, depOptions);
        depSel.value = st.dependsOnIdx !== undefined ? String(st.dependsOnIdx) : '';
        depSel.addEventListener('change', function(){ 
          var v = depSel.value;
          if (v==='') { st.dependsOnIdx = undefined; st.dependsOn = []; }
          else { st.dependsOnIdx = parseInt(v,10); st.dependsOn = [subtasks[st.dependsOnIdx] ? subtasks[st.dependsOnIdx].title : '']; }
        });
        var delBtn = el('button', { class:'btn small danger', text:'X', title:'Remove subtask', onclick:function(){ subtasks.splice(idx,1); renderSubtasks(); } });
        var row = el('div', { style:{display:'grid',gridTemplateColumns:'1fr 140px 140px 32px',gap:'6px',alignItems:'center',marginBottom:'4px'} }, titleI, assI, depSel, delBtn);
        rows.push(row);
      });
      var addBtn = el('button', { class:'btn small', text:'+ Add subtask', onclick:function(){ subtasks.push({title:'',assignee:'',dependsOn:[]}); renderSubtasks(); } });

    }
    renderSubtasks();
    function updateStoryVisibility(){
      var isStory = typeSel.value==='story';

    }
    typeSel.addEventListener('change', updateStoryVisibility);
    [titleIn, assigneeIn, wsIn, labelsIn].forEach(function (n) {
      n.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });
    });
    briefIn.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(); });
    function submit() {
      var title = titleIn.value.trim(), brief = briefIn.value;
      if (!title) { err.textContent = 'A title is required.'; err.classList.remove('hidden'); titleIn.focus(); return; }
      if (!brief.trim() && typeSel.value!=='story') { err.textContent = 'The instructions are required — the agent sees only this.'; err.classList.remove('hidden'); briefIn.focus(); return; }
      var labels = labelsIn.value.split(',').map(function(x){ return x.trim().toLowerCase(); }).filter(Boolean).slice(0,5);
      var payload = {
        title: title, brief: brief, assignee: assigneeIn.value.trim() || undefined,
        allowedFiles: allowedIn.value, forbiddenFiles: forbiddenIn.value,
        acceptance: acceptIn.value, workspacePath: wsIn.value.trim(),
        type: typeSel.value, priority: prioritySel.value, labels: labels
      };
      if (typeSel.value==='story'){
        payload.mode = modeSel.value;
        var subs = subtasks.filter(function(s){ return s.title && s.title.trim(); }).map(function(s, i){
          var dep = [];
          if (s.dependsOnIdx!==undefined && subtasks[s.dependsOnIdx] && subtasks[s.dependsOnIdx].title) {
            dep = [subtasks[s.dependsOnIdx].title];
          }
          return { title: s.title.trim(), assignee: s.assignee.trim()||undefined, dependsOn: dep };
        });
        payload.subtasks = subs;
      }
      if (deployCheck.checked) payload.kind = 'deploy';

      api('/api/mesh/task', payload).then(function (r) {
        if (!r) return;
        ov.close();

      });
    }
    var modeField = field('mode', 'Story mode', 'parallel = no auto deps, sequential = chain', modeSel);
    modeField.style.display = 'none';
    var ov = openDialog({
      wide: true, title: 'New task',

        err,

          field('assignee', 'Assign to', 'empty = any waiting worker - known ids are suggested', assigneeIn),
          field('workspacePath', 'Project folder', 'defaults to the newest task folder', wsIn),

          field('priority', 'Priority', null, prioritySel),
          el('div', { class: 'full' }, field('labels', 'Labels', 'comma separated, max 5, slug [a-z0-9-]', labelsIn)),
          modeField,
          el('div', { class:'full' }, subtaskContainer),
          field('allowedFiles', 'Files it may change', 'one per line', allowedIn),

          el('div', { class: 'full' }, field('acceptance', 'Done when', 'one per line', acceptIn)),
          el('div', { class: 'full' }, el('div', { style:{display:'flex',gap:'12px',flexWrap:'wrap'} },
            el('label', { class:'check' }, deployCheck, el('span', { text:'Deployment task' })),
            el('label', { class:'check' }, noDeployCheck, el('span', { text:'No deployment needed' }))))
        )
      ],
      foot: [
        el('button', { class: 'btn', text: 'Cancel', onclick: function () { ov.close(); } }),
        el('button', { class: 'btn primary', text: 'Create task', onclick: submit })

    });
    updateStoryVisibility();
    titleIn.focus();
  }

  /* 8. agent popup */

  function openHandover(taskId){
    var t = taskById(taskId);

    var holderId = t.assignedIDE || t.assignee || '';
    var holderName = holderId ? agentName(holderId) : 'none';
    var filesN = (t.filesModified && t.filesModified.length) || 0;
    var isInProgress = t.status==='claimed' || t.status==='in_progress' || t.status==='blocked';
    var allAgents = workers().slice();
    allAgents.sort(function(a,b){
      var sa = agentStateOf(a.id), sb = agentStateOf(b.id);

      return (order[sa]||2)-(order[sb]||2) || agentName(a.id).localeCompare(agentName(b.id));
    });

      var nodes = [];

        onclick:function(){ selectedTo=''; renderList(); },

      }, el('span', { class:'h-state idle' }), el('span', { text:'Open to any worker' }));

          el('div', { class:'meta' }, el('b',{text:'Status'}), el('span',{text: STATUS_LABEL[t.status]||t.status })),
          el('div', { class:'meta' }, el('b',{text:'Files changed'}), el('span',{text: String(filesN)}))
        ),

          api('/api/mesh/task/'+encodeURIComponent(t.id)+'/handover', payload).then(function(r){
            if (r){ ov.close(); if (DEMO) push(); toast('Handed over '+t.id,'success'); }
          });

    var renameIn = el('input', { type: 'text', value: a.displayName || '', placeholder: a.id + ' (empty resets to the id)', 'aria-label': 'Display name for ' + a.id });

      title: agentName(a.id) + (a.manual ? ' · manual' : ''),

            api('/api/mesh/agent/' + encodeURIComponent(a.id) + '/rename', { name: renameIn.value.trim() })
              .then(function (r) { if (r) { toast('Agent renamed', 'success'); if (DEMO) push(); ov.close(); } });

    function paint() {

      replace(body,
        el('div', { class: 'meta-grid' },

            return m;
          })()),
        el('div', { class: 'section' }, el('h3', { text: 'Display name' }), renameIn,
          el('div', { class: 'muted', text: 'Empty value resets to the id. The name is used everywhere the agent appears.' })),
        !a.manual ? el('div', { class: 'section' }, el('h3', { text: 'Start prompt for this agent' }),
          el('div', { class: 'pre', text: startPromptFor(a.id) }),
          el('button', { class: 'btn small', text: 'Copy start prompt', onclick: function () { copyText(startPromptFor(a.id), 'Start prompt'); } })) : null,
        cur ? el('div', { class: 'section' }, el('h3', { text: 'Currently working on' }),
          el('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } },
            el('button', { class: 'need', style: { maxWidth: '100%' }, text: cur.id + ' — ' + cur.title, onclick: function () { openTask(cur.id); } }),
            el('span', { class: 'timer badge time', title: 'time in ' + STATUS_LABEL[cur.status] }, timerNode(cur, { staleAt: 30 * 60000 })))) : null,
        el('div', { class: 'section' }, el('h3', { text: 'Tasks' }),
          myTasksView(a.id))
      );
    }
    function myTasksView(agentId) {
      var mine = S.tasks.filter(function (t) { return (t.assignee || t.assignedIDE) === agentId; });
      if (!mine.length) return el('div', { class: 'muted', text: 'No tasks assigned.' });
      var order = ['blocked', 'review', 'pending_deploy', 'in_progress', 'claimed', 'backlog', 'done', 'cancelled'];
      var groups = {};
      mine.forEach(function (t) { (groups[t.status] = groups[t.status] || []).push(t); });
      return el('div', { class: 'section' }, order.filter(function (s) { return groups[s]; }).map(function (s) {

  }

  /* 9. move menu (keyboard equivalent of drag & drop) */
  function movesFor(t) {
    var out = [];
    if (t.status === 'done' || t.status === 'cancelled') return out;
    var manual = isManual(t.assignee || t.assignedIDE);
    if (manual) {   // a manual agent's task is mine to move by hand
      var opts = [['backlog', 'Waiting'], ['in_progress', 'Working'], ['review', 'In review'], ['pending_deploy', 'Pending deployment'], ['done', 'Done'], ['cancelled', 'Cancelled']];
      opts.forEach(function (o) {
        if (o[0] === t.status) return;
        out.push({ label: 'Move to ' + o[1], run: function () { moveTask(t, o[0]); } });
      });
      return out;
    }
    if (t.status === 'review') {
      out.push({ label: 'Approve → Pending', run: function () { approveTask(t); } });
      out.push({ label: 'Approve without deploying → Done', run: function () { approveWithoutDeploy(t); } });
      out.push({ label: 'Send back → Waiting', run: function () { openTask(t.id, { sendBack: true }); } });
    }
    if (t.status === 'pending_deploy') {
      out.push({ label: 'Mark deployed → Done', run: function(){ markDeployed(t); } });
    }
    if (t.status === 'backlog') {
      workers().forEach(function (a) {
        out.push({ label: 'Assign to ' + agentName(a.id), run: function () { reassign(t, a.id); } });
      });
      if (t.assignee) out.push({ label: 'Unassign', run: function () { reassign(t, ''); } });
      runnableAgents().forEach(function (a) {
        out.push({ label: '▶ Run ' + (a.launch ? a.launch.label : a.id) + ' now', run: function () { runAgent(a.id); } });
      });
    }
    if (canRelease(t)) out.push({ label: 'Release to Waiting', run: function () { doRelease(t); } });
    out.push({ label: 'Cancel task', run: function () { doCancel(t); } });
    return out;
  }
  function runnableAgents() {
    var out = workers().filter(function (a) { return !a.manual && a.launch && !a.launch.running; });
    (S.launchers || []).forEach(function (l) {
      if (out.some(function (a) { return a.id === l.id; })) return;

  /* 10. drag & drop */
  var dragTask = null;
  function dropAction(t, rawZone, agentId) {
    var s = t.status;
    var zone = rawZone.indexOf('col:') === 0 ? rawZone.slice(4) : rawZone; // "col:working" -> "working"
    var manual = isManual(t.assignee || t.assignedIDE);
    if (s === 'done') return { ok: false, why: "Done tasks can't be moved" };
    if (s === 'cancelled') return { ok: false, why: "Cancelled tasks can't be moved" };
    if (zone === 'cancel') return { ok: true, kind: 'cancel' };
    if (zone === 'agent') {
      if (manual) return { ok: false, why: 'A manual task has no agent working in your repo — move it between columns instead' };
      if (s !== 'backlog') return { ok: false, why: 'Only waiting tasks can be reassigned — this one is already in the agent’s hands' };
      if ((t.assignee || '') === agentId) return { ok: false, why: 'Already assigned to ' + agentName(agentId) };
      return { ok: true, kind: 'assign', agentId: agentId };
    }
    if (manual) {   // Waiting / Working / In review / Pending / Done belong to me for manual agents
      if (zone === 'blocked') return { ok: false, why: 'Only an agent can ask a question — a manual task never goes here' };
      if (zone === 'backlog') return s === 'backlog' ? { ok: false, why: 'Already waiting' } : { ok: true, kind: 'move', to: 'backlog' };
      if (zone === 'working') return s === 'in_progress' ? { ok: false, why: 'Already in Working' } : { ok: true, kind: 'move', to: 'in_progress' };
      if (zone === 'review') return s === 'review' ? { ok: false, why: 'Already in review' } : { ok: true, kind: 'move', to: 'review' };
      if (zone === 'pending_deploy') return s === 'pending_deploy' ? { ok: false, why: 'Already pending deployment' } : { ok: true, kind: 'move', to: 'pending_deploy' };
      if (zone === 'done') return { ok: true, kind: 'move', to: 'done' };
      if (zone === 'cancelled') return { ok: true, kind: 'move', to: 'cancelled' };
      return { ok: false, why: 'That column is not part of the manual flow' };
    }
    // real agent tasks
    if (s === 'pending_deploy') {
      if (zone === 'done') return { ok: true, kind: 'deployed' };
      return { ok: false, why: 'Pending deployment tasks can only be marked deployed (drag to Done) or cancelled' };
    }
    if (s === 'review') {
      if (zone === 'pending_deploy') return { ok: true, kind: 'approve' };
      if (zone === 'done') return { ok: true, kind: 'approve_no_deploy' };
    }
    if (zone === 'done') return s === 'review' ? { ok: true, kind: 'approve' } : { ok: false, why: 'Only review tasks can be approved — the agent has to finish the work first' };
    if (zone === 'pending_deploy') return s === 'review' ? { ok: true, kind: 'approve' } : { ok: false, why: 'Only review tasks can go to pending deployment' };
    if (zone === 'working') return s === 'review' ? { ok: true, kind: 'sendback' } : { ok: false, why: 'Only the agent can start work — assign it instead' };
    if (zone === 'backlog') return { ok: false, why: 'Waiting is where new tasks start — assign it to an agent instead' };
    if (zone === 'review') return { ok: false, why: 'The agent finishes the work — drag to Pending or Done to approve it' };
    if (zone === 'blocked') return { ok: false, why: 'The agent marks itself blocked when it has a question' };
    return { ok: false, why: 'The board columns follow the agent’s progress, not your drags' };
  }
  function startDrag(e, t) {
    if (!tileDraggable(t)) {
      e.preventDefault();
      toast(t.status === 'done' || t.status === 'cancelled' ? "Done tasks can't be moved" : 'This tile cannot be moved', 'warn');
      return;
    }
    dragTask = t;
    try { e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed = 'move'; } catch (err) { }
    e.currentTarget.classList.add('dragging');
    document.body.classList.add('is-dragging');
    var st = $('#cancelStrip'); if (st) st.setAttribute('aria-hidden', 'false');
    markZones(t);
  }
  function endDrag() {
    dragTask = null;
    document.body.classList.remove('is-dragging');
    var st = $('#cancelStrip'); if (st) st.setAttribute('aria-hidden', 'true');
    var d = document.querySelectorAll('.dragging');
    for (var i = 0; i < d.length; i++) d[i].classList.remove('dragging');
    var z = document.querySelectorAll('.drop-valid,.drop-invalid,.over');
    for (var j = 0; j < z.length; j++) z[j].classList.remove('drop-valid', 'drop-invalid', 'over');
  }
  function markZones(t) {
    var zones = document.querySelectorAll('[data-zone]');
    for (var i = 0; i < zones.length; i++) {
      var z = zones[i], a = dropAction(t, z.dataset.zone, z.dataset.agent || '');
      z.classList.add(a.ok ? 'drop-valid' : 'drop-invalid');
    }
    var strip = $('#cancelStrip');
    if (strip) strip.classList.toggle('drop-valid', dropAction(t, 'cancel', '').ok);
  }
  function initStrip() {
    var strip = $('#cancelStrip');

  }
  function zoneFrom(target) {
    var n = target && target.closest ? target.closest('[data-zone]') : null;
    return n ? { zone: n.dataset.zone, agent: n.dataset.agent || '' } : null;
  }
  document.addEventListener('dragover', function (e) {

  });
  document.addEventListener('drop', function (e) {

    else if (a.kind === 'deployed') markDeployed(t);
    else if (a.kind === 'sendback') openTask(t.id, { sendBack: true });
    else if (a.kind === 'assign') reassign(t, a.agentId);
    else if (a.kind === 'cancel') doCancel(t);
    else if (a.kind === 'move') moveTask(t, a.to);
  });

    // apply initial rail state
    document.body.classList.toggle('rail-collapsed', !!UI.railCollapsed);
    document.body.classList.toggle('rail-expanded', !UI.railCollapsed);
  }
  loadUI();
  loadPrefs();
  applyTheme();
  applyDensity();
  applyGroup();
  initStrip();
  wire();
  $('#showCancelled').checked = !!UI.showCancelled;
  if (DEMO) {
    $('#demoBadge').classList.remove('hidden');
    setConn('live', 'demo');
    applyState(demoState());
  } else {
    setConn('', 'connecting…');
    render();
    connect();
  }

  window.addEventListener('resize', function () { if (window.innerWidth > 1200) { $('#activity').classList.toggle('open', !!UI.activity); } });
  // expose a couple of internals for manual debugging only
  window.AgentMesh = { get state() { return S; }, render: render };
})();</script>
</body>
</html>
