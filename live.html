<!DOCTYPE html>
<html lang="en">
<head>
<script>try{
var LS='agentmesh.ui.v1',PREF='agentmesh.prefs.v1';
var raw=localStorage.getItem(LS),o=raw?JSON.parse(raw):{};
var theme=o.theme||'auto',mainTab=o.mainTab||'board',collapsed=o.collapsedCols||{},rail=o.railCollapsed!==false?'collapsed':'expanded';
var praw=localStorage.getItem(PREF),p=praw?JSON.parse(praw):{},compact=!!p.compact;
var html=document.documentElement;
if(theme!=='auto')html.setAttribute('data-theme',theme);
else{try{if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)html.setAttribute('data-theme','dark');}catch(e){}}
html.setAttribute('data-compact',compact?'true':'false');
html.setAttribute('data-rail',rail);
html.setAttribute('data-tab',mainTab);
var keys=[];for(var k in collapsed)if(collapsed[k])keys.push(k);
if(keys.length)html.setAttribute('data-cols',keys.join(','));
html.setAttribute('data-loaded','false');
}catch(e){}</script>

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-13)/1.5 ui-rounded,'SF Pro Rounded','Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.app{height:100%;display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr)}
.topbar{
  height:56px;min-height:56px;
  display:flex;align-items:center;gap:12px;
  padding:0 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;
  flex:0 0 56px;
}
.topbar-left{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-width:0}
.topbar-left .logo{color:var(--accent);font-size:16px;font-weight:800}
.topbar-left .brand-name{font-weight:700;font-size:var(--fs-14);letter-spacing:-0.01em}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:var(--radius-pill);padding:2px 10px;background:var(--card-bg)}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--grey-dot)}
.conn.live{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.conn.live .dot{background:var(--ok)}
.conn.down{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.conn.down .dot{background:var(--danger)}
.badge-demo{margin-left:6px}
.topbar-center{flex:1 1 420px;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;min-width:0}
.search-wrap{position:relative;flex:1 1 auto;display:flex;align-items:center}
.search-wrap .search-icon{position:absolute;left:12px;color:var(--muted);font-size:13px;pointer-events:none}
#search{width:100%;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-pill);padding:8px 14px 8px 32px;font-size:var(--fs-13);transition:border-color var(--t),box-shadow var(--t),background var(--t)}
#search:focus{outline:none;border-color:var(--border-strong);box-shadow:var(--glow)}
.topbar-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
.btn{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-pill);padding:7px 14px;transition:background var(--t),border-color var(--t),color var(--t),transform var(--t),box-shadow var(--t);font-weight:600;font-size:var(--fs-13)}
.btn:hover{background:var(--panel);border-color:var(--border-strong);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow-sm);font-weight:700}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:var(--shadow-md)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--card-bg);border-color:var(--border);color:var(--text)}
.btn.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:50%;flex:0 0 36px}
.btn.icon.ghost{width:36px;height:36px}
.btn.small{padding:4px 10px;font-size:11.5px}
.btn.tiny{padding:3px 8px;font-size:11px}
.btn.pill{padding:8px 16px;border-radius:var(--radius-pill)}
.btn.has-dot{position:relative}
.btn .dot-new{position:absolute;top:1px;right:1px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--panel);display:inline-block}
.count-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-pill);background:var(--danger);color:var(--card-bg);font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--panel)}
.attention-bell{position:relative}
.second-row{
  height:44px;min-height:44px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex:0 0 44px;
  overflow:hidden;
}
.main-tabs{
  display:flex;align-items:center;gap:2px;
  height:100%;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  flex:1 1 auto;min-width:0;
}
.main-tabs::-webkit-scrollbar{display:none}
.main-tabs button[role=tab]{
  background:transparent;border:0;
  border-bottom:2px solid transparent;
  padding:0 14px;height:44px;
  font-size:var(--fs-13);font-weight:var(--fw-600);
  color:var(--muted);white-space:nowrap;
  transition:color var(--t),border-color var(--t);
  flex:0 0 auto;
}
.main-tabs button[role=tab][aria-selected=true]{
  color:var(--text);border-bottom-color:var(--text);font-weight:var(--fw-700);
}
.main-tabs button[role=tab]:hover{color:var(--text)}
.board-controls{
  display:flex;align-items:center;gap:10px;
  flex:0 0 auto;margin-left:auto;
}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-pill);overflow:hidden;background:var(--card-bg);padding:2px;gap:2px}
.seg button{background:transparent;border:0;padding:6px 12px;color:var(--muted);border-radius:var(--radius-pill);font-weight:600;font-size:var(--fs-12);transition:background var(--t),color var(--t)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--panel);font-weight:700}
.check{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:var(--fs-12);cursor:pointer;font-weight:500;white-space:nowrap}
.view-menu-wrap{flex:0 0 auto}
@media (max-width:900px){
  .board-controls{display:none}
  .view-menu-wrap{display:flex !important}
}
@media (min-width:901px){
  .view-menu-wrap{display:none !important}
}
.stat-chips{
  display:flex;gap:8px;
  padding:8px 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  flex:0 0 auto;
  min-height:40px;
  align-items:center;
}
.stat-chips::-webkit-scrollbar{display:none}
.stat-chips:empty{display:none}
.counts{display:flex;gap:8px;flex-wrap:nowrap;align-items:center}
.stat-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;
  border-radius:var(--radius-pill);
  background:var(--card-bg);
  border:1px solid var(--border);
  font-size:var(--fs-12);font-weight:var(--fw-600);
  color:var(--text);cursor:pointer;white-space:nowrap;
  transition:background var(--t),border-color var(--t),transform var(--t),box-shadow var(--t);
  box-shadow:var(--shadow-sm);
}
.stat-chip:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.stat-chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.stat-chip .num{font-weight:var(--fw-700)}
.needs{
  display:flex;gap:8px;
  padding:8px 16px;
  background:var(--accent-soft);
  border-bottom:1px solid var(--border);
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;
  align-items:center;
  min-height:40px;
  flex:0 0 auto;
}
.needs.hidden{display:none !important}
.needs .needs-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-fg);flex:0 0 auto}
.need{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--radius-pill);padding:5px 12px;
  font-size:var(--fs-12);font-weight:var(--fw-600);
  max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:pointer;transition:border-color var(--t),box-shadow var(--t),transform var(--t);
  box-shadow:var(--shadow-sm);
}
.need:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.need .need-icon{font-size:12px;flex:0 0 auto}
.need.warning{border-color:var(--warn);background:var(--warn-soft)}
:root{--rail-w:60px;--rail-expanded-w:260px}
body.rail-expanded{--rail-w:260px}
body.rail-collapsed{--rail-w:60px}
main{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:0;height:100%}
.rail{border-right:1px solid var(--border);background:var(--panel);overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:10px;transition:width var(--t),transform var(--t);width:var(--rail-w);min-width:var(--rail-w)}
.rail.slim{align-items:center;padding:10px 6px}
.rail-header{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.rail.slim .rail-header{justify-content:center;flex-direction:column}
.rail-avatar-list{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.rail-avatar-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.rail-avatar-btn{position:relative;background:transparent;border:1px solid transparent;border-radius:12px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;transition:background var(--t),border-color var(--t),box-shadow var(--t)}
.rail-avatar-btn:hover{background:var(--card-bg);border-color:var(--border);box-shadow:var(--shadow-sm)}
.rail-avatar-btn .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--card-bg);font-size:11px;font-weight:700;position:relative;box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--ring-color, transparent);transition:box-shadow var(--t)}
.rail-avatar-btn.busy{--ring-color:var(--ring-busy)}
.rail-avatar-btn.idle{--ring-color:var(--ring-idle)}
.rail-avatar-btn.offline{--ring-color:var(--ring-offline)}
.rail-avatar-btn .status-dot{position:absolute;bottom:0;right:2px;width:10px;height:10px;border:2px solid var(--panel);border-radius:50%}
.rail-count{font-size:10px;color:var(--text);background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-pill);padding:1px 6px;min-width:18px;text-align:center;line-height:1.4;font-weight:700;position:absolute;top:2px;right:2px;box-shadow:var(--shadow-sm)}
.rail h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0;font-weight:700}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.board{
  flex:1 1 auto;min-height:0;
  display:flex;gap:12px;
  overflow:auto;
  padding:12px;
  align-items:flex-start;
  background:var(--bg);
  background-image:radial-gradient(var(--dots) 1px, transparent 1px);
  background-size:22px 22px;
  scroll-snap-type:x proximity;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
  position:relative;
}
.board::-webkit-scrollbar{height:8px;width:8px}
.board::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
.board::-webkit-scrollbar-track{background:transparent}
.board::after{
  content:'';position:sticky;right:0;top:0;bottom:0;
  width:40px;flex:0 0 40px;
  background:linear-gradient(to right, transparent, var(--bg));

<div class="second-row">
  <div id="mainTabs" class="main-tabs" role="tablist" aria-label="Main sections">
    <button role="tab" id="tab-board" data-tab="board" aria-selected="true" tabindex="0">Board</button>
    <button role="tab" id="tab-stories" data-tab="stories" aria-selected="false" tabindex="-1">Stories</button>
    <button role="tab" id="tab-team" data-tab="team" aria-selected="false" tabindex="-1">Team</button>
    <button role="tab" id="tab-archive" data-tab="archive" aria-selected="false" tabindex="-1">Archive</button>
  </div>
  <div class="board-controls board-only">
    <div class="seg" role="group" aria-label="Group by">
      <button id="groupStatus" data-group="status" aria-pressed="true">Status</button>
      <button id="groupAgent" data-group="agent" aria-pressed="false">Agent</button>
      <button id="groupStory" data-group="story" aria-pressed="false">Story</button>
    </div>
    <label class="check"><input type="checkbox" id="compactToggle"> Compact</label>
    <label class="check"><input type="checkbox" id="showCancelledArchive"> Show cancelled</label>
    <input type="checkbox" id="showCancelled" class="hidden" aria-hidden="true">
  </div>
  <div class="view-menu-wrap hidden" id="viewMenuWrap">
    <button id="viewMenuBtn" class="btn small" aria-label="View options" title="View options">View ▾</button>
  </div>
  <span id="boardHint" class="muted hidden" style="font-size:11px"></span>
</div>
<div id="statChips" class="stat-chips board-only">
  <div id="counts" class="counts"></div>
</div>
<div id="needs" class="needs hidden" aria-live="polite"></div>
<div id="activityBackdrop" class="activity-backdrop"></div>
<div id="attentionBackdrop" class="activity-backdrop"></div>
<main>
  <aside class="rail" id="rail" aria-label="Team and file locks"></aside>
  <section class="center">
    <div id="cancelStrip" class="cancel-strip" aria-hidden="true">Drop here to cancel</div>
    <div id="boardEmpty" class="notice hidden" style="margin:10px 10px 0"></div>
    <div id="setup" class="setup hidden" aria-label="First-run setup"></div>
    <div id="board" class="board" aria-label="Task board"></div>
    <div id="storiesView" class="stories-view hidden" aria-label="Stories"></div>
    <div id="teamView" class="team-view hidden" aria-label="Team"></div>
    <div id="archiveView" class="archive-view hidden" aria-label="Archive">
      <div class="archive-toolbar">
        <input id="archiveSearch" type="search" placeholder="Search archive…" aria-label="Search archive">
        <span id="archiveCount" class="muted"></span>
      </div>
      <div id="archiveList" class="archive-list"></div>
    </div>
  </section>
  <aside class="activity" id="activity" aria-label="Activity feed">
    <div class="activity-head"><strong>Activity</strong><span class="muted" id="activityCount"></span>
      <button class="btn small ghost" id="activityClose" aria-label="Close activity feed" style="margin-left:auto">✕</button>
    </div>
    <div class="activity-feed" id="activityFeed"></div>
  </aside>
  <aside class="attention-panel" id="attention" aria-label="Attention">
    <div class="attention-head"><strong>Attention</strong><span class="muted" id="attentionCount"></span>
      <button class="btn small ghost" id="attentionClose" aria-label="Close attention" style="margin-left:auto">✕</button>
    </div>
    <div class="attention-feed" id="attentionFeed"></div>
  </aside>
</main>
<datalist id="agentIds"></datalist>
<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<script id="mesh-init" type="application/json"></script>

<script>'use strict';

(function () {

  // V4-3: parse mesh-init early, actual apply after S/COLS defined
  var __meshEmbedded = null;
  try {
    var __meshEl = document.getElementById('mesh-init');
    if (__meshEl){
      var __txt = __meshEl.textContent.trim();
      if (__txt) __meshEmbedded = JSON.parse(__txt);
    }
  } catch(e){ __meshEmbedded = null; }

  /* 0. environment */
  var DEMO = false;
  try { DEMO = new URLSearchParams(location.search).get('demo') === '1'; } catch (e) { DEMO = false; }

  /* 1. small helpers (createElement / textContent only — no innerHTML ever) */
  function el(tag, props) {
    var n = document.createElement(tag), k, v;
    if (props) for (k in props) {
      v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = String(v);
      else if (k === 'dataset') { for (var d in v) if (v[d] !== null && v[d] !== undefined) n.dataset[d] = String(v[d]); }
      else if (k === 'style' && typeof v === 'object') { for (var s in v) n.style[s] = v[s]; }
      else if (k === 'value' && n.tagName === 'TEXTAREA') n.value = String(v); // the value attribute does nothing for a textarea
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else n.setAttribute(k, String(v));
    }
    for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
    return n;
  }
  function add(parent, kid) {
    if (kid === null || kid === undefined || kid === false || kid === '') return;
    if (Array.isArray(kid)) { for (var i = 0; i < kid.length; i++) add(parent, kid[i]); return; }
    if (kid instanceof Node) { parent.appendChild(kid); return; }
    parent.appendChild(document.createTextNode(String(kid)));
  }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
  function replace(node) {
    clear(node);
    for (var i = 1; i < arguments.length; i++) add(node, arguments[i]);
    return node;
  }
  function setText(node, txt) { if (node && node.textContent !== String(txt)) node.textContent = String(txt); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  /* ---- time ---- */
  function tms(iso) { if (!iso) return null; var t = Date.parse(iso); return isNaN(t) ? null : t; }
  function agoText(iso) {
    var t = tms(iso);
    if (t === null) return '';
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return Math.round(s) + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    if (s < 604800) return Math.round(s / 86400) + 'd ago';
    return new Date(t).toLocaleDateString();
  }
  function agoNode(iso, cls) { return el('span', { class: cls || 'ago', dataset: { ago: iso || '' }, text: agoText(iso) }); }
  function clockText(iso) { var t = tms(iso); return t === null ? '' : new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function durationText(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ' + (m % 60) + 'm';
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  }
  var timerInterval = null;
  function refreshTimes() {
    var agos = document.querySelectorAll('[data-ago]');
    for (var i = 0; i < agos.length; i++) setText(agos[i], agoText(agos[i].dataset.ago));
    var since = document.querySelectorAll('[data-since]');
    for (var j = 0; j < since.length; j++) {
      setText(since[j], '⏱ ' + durationText(Date.now() - Number(since[j].dataset.since)));
      var limit = Number(since[j].dataset.staleAt || 0);
      if (limit) since[j].classList.toggle('stale', Date.now() - Number(since[j].dataset.since) > limit);
    }
  }
  function tickTimers(){
    if (document.hidden) return;
    refreshTimes();
  }
  function startTimer(){
    if (timerInterval) return;
    timerInterval = window.setInterval(tickTimers, 1000);
  }
  function stopTimer(){
    if (timerInterval){ window.clearInterval(timerInterval); timerInterval=null; }
  }
  startTimer();
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stopTimer();
    else { refreshTimes(); startTimer(); }
  });
  /* ---- identity ---- */
  function hueOf(id) { var h = 0, s = String(id || '?'); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function initialsOf(name) {
    var s = String(name || '?').replace(/[^A-Za-z0-9]+/g, ' ').trim();
    if (!s) return '?';
    var p = s.split(' ');
    return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }
  function avatarCfg(agentId) { return AV[agentId] || {}; }
  function avatarColor(agentId) {
    var cfg = avatarCfg(agentId);
    return cfg.color || ('hsl(' + hueOf(agentId || '?') + ' 56% 44%)');
  }
  function avatarNode(agentId, cls) {
    var a = agentById(agentId);
    var label = a ? (a.displayName || a.id) : (agentId || '?');
    var cfg = avatarCfg(agentId);
    var node = el('span', { class: 'avatar ' + (cls || ''), title: label, 'aria-hidden': 'true', style: { background: avatarColor(agentId) } });
    if (cfg.img) node.appendChild(el('img', { src: cfg.img, alt: '' }));
    else if (cfg.emoji) node.appendChild(el('span', { class: 'avatar-emoji', text: cfg.emoji }));
    else node.appendChild(el('span', { text: initialsOf(label) }));
    return node;
  }
  /* ---- toasts ---- */
  function toast(msg, kind) {
    var t = el('div', { class: 'toast ' + (kind || ''), role: 'status' }, el('span', { text: msg }));
    var wrap = $('#toasts');
    wrap.appendChild(t);
    window.setTimeout(function () {
      t.classList.add('out');
      window.setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 220);
    }, kind === 'error' ? 6500 : 3800);
  }
  /* ---- overlays (stack, Esc, focus trap) ---- */
  var overlays = [];
  function trapFocus(root) {
    root.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab') return;
      var list = Array.prototype.filter.call(
        root.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'),
        function (n) { return !n.disabled && n.offsetParent !== null; });
      if (!list.length) return;
      var first = list[0], last = list[list.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }
  function closeOverlay(ov) {
    var i = overlays.indexOf(ov);
    if (i < 0) return;
    overlays.splice(i, 1);
    if (ov.el && ov.el.parentNode) ov.el.parentNode.removeChild(ov.el);
    if (ov.onClose) { try { ov.onClose(); } catch (e) { } }
    if (ov.returnFocus && ov.returnFocus.focus) { try { ov.returnFocus.focus(); } catch (e) { } }
  }
  function closeTopOverlay() { if (overlays.length) closeOverlay(overlays[overlays.length - 1]); return overlays.length; }
  function openDialog(opts) {
    var label = opts.label || opts.title || 'Dialog';
    var head = el('div', { class: 'dialog-head' });
    var ov = {};
    var closeBtn = el('button', { class: 'btn icon ghost', 'aria-label': 'Close dialog', title: 'Close (Esc)', text: '✕', onclick: function () { closeOverlay(ov); } });
    if (opts.title !== undefined) head.appendChild(el('h2', { class: 'dialog-title', text: opts.title }));
    add(head, opts.head || []);
    head.appendChild(closeBtn);
    var body = el('div', { class: 'dialog-body' });
    add(body, opts.body || []);
    var foot = el('div', { class: 'dialog-foot' });
    add(foot, opts.foot || []);
    var dialog = el('div', { class: 'dialog ' + (opts.cls || '') + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': label });
    dialog.appendChild(head);
    if (opts.tabs) dialog.appendChild(opts.tabs);
    dialog.appendChild(body);
    dialog.appendChild(foot);
    var backdrop = el('div', { class: 'backdrop', onclick: function (e) { if (e.target === backdrop && opts.dismissable !== false) closeOverlay(ov); } }, dialog);
    trapFocus(backdrop);
    ov = { el: backdrop, dialog: dialog, head: head, body: body, foot: foot, close: function () { closeOverlay(ov); }, returnFocus: opts.returnFocus || document.activeElement, onClose: opts.onClose };
    overlays.push(ov);
    document.body.appendChild(backdrop);
    return ov;
  }
  function uiConfirm(opts) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(v) { if (done) return; done = true; resolve(v); }
      var ov = openDialog({
        cls: 'small', title: opts.title || 'Are you sure?',
        body: [el('div', { class: 'message' }, el('div', { text: opts.message || '' })), opts.detail ? el('div', { class: 'notice warn', text: opts.detail }) : null],
        foot: [
          el('button', { class: 'btn', text: 'Cancel', onclick: function () { finish(false); closeOverlay(ov); } }),
          el('button', { class: 'btn ' + (opts.danger ? 'danger' : 'primary'), text: opts.confirmLabel || 'Confirm', onclick: function () { finish(true); closeOverlay(ov); } })
        ],
        onClose: function () { finish(false); }
      });
    });
  }
  function uiPrompt(opts) {
    return new Promise(function (resolve) {
      var input = el('textarea', { rows: '3', placeholder: opts.placeholder || '' });
      var err = el('div', { class: 'field err hidden' });
      var value = null;
      var ov = openDialog({
        cls: 'small', title: opts.title || 'Input',
        head: opts.message ? [el('div', { class: 'head-main' }, el('div', { class: 'message', text: opts.message }))] : null,
        body: [el('label', { class: 'field' }, el('span', { text: opts.label || '' }), input, err)],
        foot: [
          el('button', { class: 'btn', text: 'Cancel', onclick: function () { ov.close(); } }),
          el('button', {
            class: 'btn primary', text: opts.confirmLabel || 'Send', onclick: function () {
              if (opts.required !== false && !input.value.trim()) { err.textContent = 'Please write something first.'; err.classList.remove('hidden'); input.focus(); return; }
              value = input.value; ov.close();
            }
          })
        ],
        onClose: function () { resolve(value); }
      });
      input.focus();
    });
  }

  /* 2. state + persisted view options */
  var S = { tasks: [], locks: [], events: [], agents: [], launchers: [], workspacePath: '', agentState: {}, handoverHints: [], attention: [], rejected: [], ides: [], prompts: {} };
  var loaded = false;
  var skeletonRendered = false;
  var UI = { groupBy: 'status', theme: 'auto', showCancelled: false, search: '', filterAgent: '', activity: false, attention: false, compact: false, railCollapsed: true, railMobileOpen: false, activitySeen: 0, attentionSeen: 0, forceBoard: false, idesSuggestions: {}, mainTab: 'board', collapsedCols: {}, archiveSearch: '', doneExpanded: false };
  var LS_KEY = 'agentmesh.ui.v1', PREF_KEY = 'agentmesh.prefs.v1';
  var AV = {};                       // agentId -> { emoji, color, img } (UI-only, kept in localStorage)
  // V4-3: apply embedded data synchronously if present
  if (__meshEmbedded && __meshEmbedded.tasks){
    try {
      S.tasks = Array.isArray(__meshEmbedded.tasks) ? __meshEmbedded.tasks : [];
      S.locks = Array.isArray(__meshEmbedded.locks) ? __meshEmbedded.locks : [];
      S.events = Array.isArray(__meshEmbedded.events) ? __meshEmbedded.events : [];
      S.agents = Array.isArray(__meshEmbedded.agents) ? __meshEmbedded.agents : [];
      S.launchers = Array.isArray(__meshEmbedded.launchers) ? __meshEmbedded.launchers : [];
      S.agentState = __meshEmbedded.agentState && typeof __meshEmbedded.agentState === 'object' ? __meshEmbedded.agentState : {};
      S.handoverHints = Array.isArray(__meshEmbedded.handoverHints) ? __meshEmbedded.handoverHints : [];
      S.attention = Array.isArray(__meshEmbedded.attention) ? __meshEmbedded.attention : [];
      S.rejected = Array.isArray(__meshEmbedded.rejected) ? __meshEmbedded.rejected : [];
      S.ides = Array.isArray(__meshEmbedded.ides) ? __meshEmbedded.ides : [];
      S.prompts = __meshEmbedded.prompts && typeof __meshEmbedded.prompts === 'object' ? __meshEmbedded.prompts : {};
      if (__meshEmbedded.workspacePath) S.workspacePath = __meshEmbedded.workspacePath;
      loaded = true;
      try { document.documentElement.setAttribute('data-loaded','true'); } catch(e){}
    } catch(e){}
  }
  function loadUI() {
    try {
      var raw = window.localStorage.getItem(LS_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (o.groupBy === 'status' || o.groupBy === 'agent' || o.groupBy === 'story') UI.groupBy = o.groupBy;
      if (o.theme === 'light' || o.theme === 'dark' || o.theme === 'auto') UI.theme = o.theme;
      UI.showCancelled = !!o.showCancelled;
      UI.activity = !!o.activity;
      UI.attention = !!o.attention;
      UI.forceBoard = !!o.forceBoard;
      UI.search = typeof o.search === 'string' ? o.search : '';
      UI.filterAgent = typeof o.filterAgent === 'string' ? o.filterAgent : '';
      if (typeof o.railCollapsed === 'boolean') UI.railCollapsed = o.railCollapsed;
      if (typeof o.activitySeen === 'number') UI.activitySeen = o.activitySeen;
      if (typeof o.attentionSeen === 'number') UI.attentionSeen = o.attentionSeen;
      if (o.mainTab === 'board' || o.mainTab === 'stories' || o.mainTab === 'team' || o.mainTab === 'archive') UI.mainTab = o.mainTab;
      if (o.collapsedCols && typeof o.collapsedCols === 'object') UI.collapsedCols = o.collapsedCols;
      if (typeof o.archiveSearch === 'string') UI.archiveSearch = o.archiveSearch;
      if (typeof o.doneExpanded === 'boolean') UI.doneExpanded = o.doneExpanded;
    } catch (e) { /* storage unavailable — fine */ }
  }
  function loadPrefs() {
    try {
      var raw = window.localStorage.getItem(PREF_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (o.avatars && typeof o.avatars === 'object') AV = o.avatars;
      if (o.compact) UI.compact = true;
    } catch (e) { /* storage unavailable — avatars fall back to colour + initials */ }
  }
  function savePrefs() {
    try { window.localStorage.setItem(PREF_KEY, JSON.stringify({ avatars: AV, compact: !!UI.compact })); }
    catch (e) { /* ignore */ }
  }
  function setAvatar(agentId, patch) {
    var cfg = AV[agentId] || (AV[agentId] = {});
    for (var k in patch) { if (patch[k]) cfg[k] = patch[k]; else delete cfg[k]; }
    if (!cfg.emoji && !cfg.img && !cfg.color) delete AV[agentId];
    savePrefs(); render();
  }
  function saveUI() {
    try {
      window.localStorage.setItem(LS_KEY, JSON.stringify({
        groupBy: UI.groupBy, theme: UI.theme, showCancelled: UI.showCancelled,
        activity: UI.activity, attention: !!UI.attention, forceBoard: !!UI.forceBoard, search: UI.search, filterAgent: UI.filterAgent,
        railCollapsed: !!UI.railCollapsed, activitySeen: UI.activitySeen || 0, attentionSeen: UI.attentionSeen || 0,
        mainTab: UI.mainTab || 'board', collapsedCols: UI.collapsedCols || {}, archiveSearch: UI.archiveSearch || '', doneExpanded: !!UI.doneExpanded
      }));
    } catch (e) { /* ignore */ }
  }
  function agentById(id) { for (var i = 0; i < S.agents.length; i++) if (S.agents[i].id === id) return S.agents[i]; return null; }
  function agentName(id) { var a = agentById(id); return (a && a.displayName) || id || ''; }
  function isManual(id) { var a = agentById(id); return !!(a && a.manual); }
  function workers() { return S.agents.filter(function (a) { return a.role !== 'MANAGER'; }); }
  function managers() { return S.agents.filter(function (a) { return a.role === 'MANAGER'; }); }
  function taskById(id) { for (var i = 0; i < S.tasks.length; i++) if (S.tasks[i].id === id) return S.tasks[i]; return null; }
  function liveness(a) {
    var t = tms(a.lastSeen);
    if (t === null) return 'silent';
    var s = (Date.now() - t) / 1000;
    if (s < 90) return 'active';
    if (s < 600) return 'quiet';
    return 'silent';
  }
  function isWaiting(a) { var t = tms(a.waitingUntil); return t !== null && t > Date.now(); }
  function statusSince(t) {          // when the task entered the status it is in now
    var log = t.progressLog || [];
    for (var i = log.length - 1; i >= 0; i--) {
      if (log[i].status && log[i].status !== t.status) return tms(log[i].at) || tms(t.updatedAt);
    }
    if (t.status !== 'backlog') return tms(t.claimedAt) || tms(t.updatedAt);
    return tms(t.updatedAt);
  }
  function timerNode(t, opts) {
    opts = opts || {};
    var since = statusSince(t);
    if (!since) return agoNode(t.updatedAt, opts.class || '');
    var live = t.status !== 'done' && t.status !== 'cancelled';
    var stale = opts.staleAt || 0;
    var node = el('span', {
      class: 'timer ' + (opts.class || ''), title: 'in ' + (STATUS_LABEL[t.status]||t.status) + ' for ' + durationText(Date.now() - since),
      dataset: { since: String(since), staleAt: String(stale) }, text: '⏱ ' + durationText(Date.now() - since)
    });
    return live ? node : agoNode(t.updatedAt, opts.class || '');
  }
  function taskWorkload(agentId) {
    var counts = {}, list = [];
    S.tasks.forEach(function (t) {
      if ((t.assignee || t.assignedIDE) !== agentId || t.status === 'cancelled') return;
      counts[t.status] = (counts[t.status] || 0) + 1; list.push(t);
    });
    return { counts: counts, total: list.length, open: list.filter(function (t) { return t.status !== 'done'; }).length };
  }
  function workloadBar(agentId) {
    var w = taskWorkload(agentId), order = ['in_progress', 'claimed', 'todo', 'backlog', 'blocked', 'review', 'pending_deploy', 'done'];
    var bar = el('div', { class: 'wload', title: order.filter(function (k) { return w.counts[k]; })
      .map(function (k) { return w.counts[k] + ' ' + (STATUS_LABEL[k]||k); }).join(' · ') || 'no tasks' }, []);
    order.forEach(function (k) {
      if (!w.counts[k]) return;
      bar.appendChild(el('i', { class: 's-' + k, style: { flex: String(w.counts[k]) } }));
    });
    bar.style.opacity = w.total ? '' : '.45';
    return bar;
  }
  function currentTaskOf(a) {
    for (var i = 0; i < S.tasks.length; i++) {
      var t = S.tasks[i];
      if ((t.assignedIDE === a.id || (!t.assignedIDE && t.assignee === a.id)) && (t.status === 'claimed' || t.status === 'in_progress' || t.status === 'blocked')) return t;
    }
    return null;
  }

  /* 3. api + websocket */
  function readResponse(status, text) {
    var data = null;
    try { data = JSON.parse(text); } catch (e) { data = null; }
    if (status < 200 || status >= 300 || (data && data.error)) {
      toast((data && data.error) || ('Request failed (' + status + ')'), 'error');
      return null;
    }
    if (data && data.message) toast(data.message, 'success');
    return data || { success: true };
  }
  function api(path, body) {
    if (DEMO) return demoApi(path, body);
    var payload = JSON.stringify(body || {});
    if (typeof fetch === 'function') {
      return fetch(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: payload, credentials: 'same-origin'
      }).then(function (res) {
        return res.text().then(function (text) { return readResponse(res.status, text); });
      }).catch(function (err) { toast('Network error — ' + err.message, 'error'); return null; });

      var paste = el('textarea', { rows: '4', placeholder: 'Paste the chatbot’s answer here…', 'aria-label': 'Paste the chatbot response', style: { width: '100%' } });
      if (T.pasteOpen) {
        out.push(el('div', { style: { width: '100%' } }, paste));
        out.push(el('button', {
          class: 'btn primary', text: 'Submit for review', onclick: function () {
            if (!paste.value.trim()) { toast('Paste the response first', 'error'); paste.focus(); return; }
            T.forceNext = true;
            api('/api/mesh/task/' + encodeURIComponent(t.id) + '/response', { text: paste.value }).then(function (r) {
              if (r) { T.pasteOpen = false; if (DEMO) push(); closeTask(); toast('Sent to Code review', 'success'); }
            });
          }
        }));
        out.push(el('button', { class: 'btn', text: 'Never mind', onclick: function () { T.pasteOpen = false; updateTaskModal(true); } }));
      } else {
        out.push(el('button', {
          class: 'btn primary', text: 'Paste response…', onclick: function () {
            T.pasteOpen = true; updateTaskModal(true);
            window.setTimeout(function () { try { paste.focus(); } catch (e) { } }, 30); }
        }));
      }
      if (t.status !== 'review' && t.status !== 'blocked') out.push(moveMenuButton(t, 'Move to…'));
    }
    if (!hasFinal && !isManual(t.assignee || t.assignedIDE) && t.status === 'backlog') {
      // a waiting task reserved for a launchable agent, or free for any of them
      var res = t.assignee ? agentById(t.assignee) : null;
      if (res && !res.manual && res.launch && !res.launch.running) out.push(el('button', {
        class: 'btn primary', text: '▶ Run ' + (res.launch.label || res.id) + ' to start this task',
        onclick: function () { runAgent(res.id); closeTask(); toast('Run requested', 'success'); } }));
      else if (!t.assignee) out.push(runAgentMenuButton(t));
    }
    if (!hasFinal) {
      if (canRelease(t)) out.push(el('button', { class: 'btn', text: 'Release to Waiting', title: 'Take it back from the agent; it stays reserved for the same agent', onclick: function () { doRelease(t); } }));
      out.push(el('button', { class: 'btn', text: 'Hand over...', onclick: function(){ openHandover(t.id); } }));
      out.push(el('button', { class: 'btn', text: 'Edit', onclick: function () { setTaskTab('edit'); } }));
      if (t.status !== 'review') {
        out.push(el('button', {
          class: 'btn danger', text: 'Cancel task',
          onclick: function () { doCancel(t); }
        }));
      }
    } else {
      out.push(el('span', { class: 'muted', style: { alignSelf: 'center' }, text: t.status === 'done' ? 'Done — read-only.' : 'Cancelled — read-only.' }));
    }
    return out;
  }
  function startSendBack() { T.sendBack = true; T.tab = 'overview'; updateTaskModal(true); }
  function moveMenuButton(t, label) {
    var btn;
    btn = el('button', { class: 'btn', text: label, 'aria-haspopup': 'menu', onclick: function () { openMoveMenu(t, btn); } });
    return btn;
  }
  function runAgentMenuButton(t) {
    var btn;
    btn = el('button', {
      class: 'btn primary', text: '▶ Run an agent…', 'aria-haspopup': 'menu',
      onclick: function () {
        var list = runnableAgents();
        if (!list.length) { toast('No agent can be started from the board right now', 'warn'); return; }
        openMenu(btn, 'Start an agent for ' + t.id, list.map(function (a) {
          return { label: '▶ Run ' + (a.launch ? a.launch.label : a.id) + (t.assignee ? '' : ' (any agent)'), run: function () { runAgent(a.id); closeTask(); toast('Run requested', 'success'); } };
        }));
      }
    });
    return btn;
  }
  function canRelease(t) {
    return !isManual(t.assignee || t.assignedIDE) && (t.status === 'claimed' || t.status === 'in_progress' || t.status === 'blocked');
  }
  function doRelease(t) {
    var who = agentName(t.assignedIDE || t.assignee);
    uiConfirm({
      title: 'Release ' + t.id + '?',
      message: 'It goes back to Waiting, still reserved for ' + who + '. Use this when the agent is stuck or holding it while other work waits.',
      confirmLabel: 'Release to Waiting'
    }).then(function (ok) {
      if (!ok) return;
      T.forceNext = true;
      api('/api/mesh/task/' + encodeURIComponent(t.id) + '/release', {}).then(function (r) { if (r) { if (DEMO) push(); closeTask(); toast('Released to Waiting', 'success'); } });
    });
  }
  function doCancel(t) {
    uiConfirm({
      title: 'Cancel ' + t.id + '?',
      message: 'The agent will be told to stop. This cannot be undone.',
      confirmLabel: 'Cancel task', danger: true
    }).then(function (ok) {
      if (!ok) return;
      uiPrompt({ title: 'Reason (optional)', label: 'Why is this task cancelled?', required: false, confirmLabel: 'Cancel task' })
        .then(function (reason) {
          api('/api/mesh/task/' + encodeURIComponent(t.id) + '/cancel', { reason: reason || '' })
            .then(function (r) { if (r) { if (DEMO) push(); closeTask(); toast('Cancelled', 'success'); } });
        });
    });
  }
  function copyText(text, label) {
    function fallback() { try { window.prompt('Copy this text (select all, then copy):', text); } catch (e) { toast('Could not copy automatically', 'error'); } }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast((label || 'Text') + ' copied to the clipboard', 'success'); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }
  function startPromptFor(id) {
    return 'Join AgentMesh as WORKER with agent_id ' + id + '. Call mesh_register_agent, then call mesh_wait_for_task repeatedly until a task arrives, and follow its brief exactly. Never commit, push or deploy unless the brief says so. Do not run any dispatch script.';
  }

  /* 7. new task modal */
  function openNewTask() {
    var newest = S.tasks.slice().sort(function (a, b) { return (tms(b.updatedAt) || 0) - (tms(a.updatedAt) || 0); })[0];
    var defaultWs = (newest && newest.workspacePath) || S.workspacePath || '';
    var titleIn = el('input', { type: 'text', name: 'title' });
    var briefIn = el('textarea', { rows: '8', name: 'brief' });
    var assigneeIn = el('input', { type: 'text', name: 'assignee', list: 'agentIds', placeholder: 'agent id — empty = any waiting worker' });
    var allowedIn = el('textarea', { rows: '4', name: 'allowedFiles' });
    var forbiddenIn = el('textarea', { rows: '4', name: 'forbiddenFiles' });
    var acceptIn = el('textarea', { rows: '4', name: 'acceptance' });
    var wsIn = el('input', { type: 'text', name: 'workspacePath', value: defaultWs });
    var typeSel = el('select', { name:'type' }, [
      el('option', { value:'feature', text:'feature' }),
      el('option', { value:'bug', text:'bug' }),
      el('option', { value:'test', text:'test' }),
      el('option', { value:'docs', text:'docs' }),
      el('option', { value:'refactor', text:'refactor' }),
      el('option', { value:'research', text:'research' }),
      el('option', { value:'deploy', text:'deploy' }),
      el('option', { value:'story', text:'story' })
    ]);
    var prioritySel = el('select', { name:'priority' }, [
      el('option', { value:'low', text:'low' }),
      el('option', { value:'normal', text:'normal', selected:'true' }),
      el('option', { value:'high', text:'high' }),
      el('option', { value:'urgent', text:'urgent' })
    ]);
    var labelsIn = el('input', { type:'text', name:'labels', placeholder:'comma separated, max 5, e.g. ai, board' });
    var modeSel = el('select', { name:'mode' }, [
      el('option', { value:'parallel', text:'parallel' }),
      el('option', { value:'sequential', text:'sequential' })
    ]);
    var deployCheck = el('input', { type: 'checkbox', id: 'newTaskDeploy' });
    var noDeployCheck = el('input', { type: 'checkbox', id: 'newTaskNoDeploy' });
    deployCheck.addEventListener('change', function(){ if (deployCheck.checked) noDeployCheck.checked = false; });
    noDeployCheck.addEventListener('change', function(){ if (noDeployCheck.checked) deployCheck.checked = false; });
    var err = el('div', { class: 'field err hidden' });
    var subtaskContainer = el('div', { class:'section' });
    var subtasks = [];
    function renderSubtasks(){
      var rows = [];
      rows.push(el('div', { class:'muted', style:{fontSize:'11px'}, text:'Subtasks for story — title, assignee, dependsOn picker among other rows' }));
      subtasks.forEach(function(st, idx){
        var titleI = el('input', { type:'text', placeholder:'Subtask title', value: st.title||'' });
        titleI.addEventListener('input', function(){ st.title = titleI.value; });
        var assI = el('input', { type:'text', placeholder:'assignee (optional)', list:'agentIds', value: st.assignee||'' });
        assI.addEventListener('input', function(){ st.assignee = assI.value; });
        var depOptions = [el('option', { value:'', text:'no dependency' })];
        subtasks.forEach(function(other, oIdx){
          if (oIdx===idx) return;
          if (!other.title) return;
          depOptions.push(el('option', { value: String(oIdx), text: other.title.slice(0,24) }));
        });
        var depSel = el('select', {}, depOptions);
        depSel.value = st.dependsOnIdx !== undefined ? String(st.dependsOnIdx) : '';
        depSel.addEventListener('change', function(){ 
          var v = depSel.value;
          if (v==='') { st.dependsOnIdx = undefined; st.dependsOn = []; }
          else { st.dependsOnIdx = parseInt(v,10); st.dependsOn = [subtasks[st.dependsOnIdx] ? subtasks[st.dependsOnIdx].title : '']; }
        });
        var delBtn = el('button', { class:'btn small danger', text:'X', title:'Remove subtask', onclick:function(){ subtasks.splice(idx,1); renderSubtasks(); } });
        var row = el('div', { style:{display:'grid',gridTemplateColumns:'1fr 140px 140px 32px',gap:'6px',alignItems:'center',marginBottom:'4px'} }, titleI, assI, depSel, delBtn);
        rows.push(row);
      });
      var addBtn = el('button', { class:'btn small', text:'+ Add subtask', onclick:function(){ subtasks.push({title:'',assignee:'',dependsOn:[]}); renderSubtasks(); } });
      rows.push(addBtn);
      replace(subtaskContainer, rows);
    }
    renderSubtasks();
    function updateStoryVisibility(){
      var isStory = typeSel.value==='story';
      subtaskContainer.style.display = isStory ? '' : 'none';
      modeSel.closest('.field').style.display = isStory ? '' : 'none';
    }
    typeSel.addEventListener('change', updateStoryVisibility);
    [titleIn, assigneeIn, wsIn, labelsIn].forEach(function (n) {
      n.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });
    });
    briefIn.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit(); });
    function submit() {
      var title = titleIn.value.trim(), brief = briefIn.value;
      if (!title) { err.textContent = 'A title is required.'; err.classList.remove('hidden'); titleIn.focus(); return; }
      if (!brief.trim() && typeSel.value!=='story') { err.textContent = 'The instructions are required — the agent sees only this.'; err.classList.remove('hidden'); briefIn.focus(); return; }
      var labels = labelsIn.value.split(',').map(function(x){ return x.trim().toLowerCase(); }).filter(Boolean).slice(0,5);
      var payload = {
        title: title, brief: brief, assignee: assigneeIn.value.trim() || undefined,
        allowedFiles: allowedIn.value, forbiddenFiles: forbiddenIn.value,
        acceptance: acceptIn.value, workspacePath: wsIn.value.trim(),
        type: typeSel.value, priority: prioritySel.value, labels: labels
      };
      if (typeSel.value==='story'){
        payload.mode = modeSel.value;
        var subs = subtasks.filter(function(s){ return s.title && s.title.trim(); }).map(function(s, i){
          var dep = [];
          if (s.dependsOnIdx!==undefined && subtasks[s.dependsOnIdx] && subtasks[s.dependsOnIdx].title) {
            dep = [subtasks[s.dependsOnIdx].title];
          }
          return { title: s.title.trim(), assignee: s.assignee.trim()||undefined, dependsOn: dep };
        });
        payload.subtasks = subs;
      }
      if (deployCheck.checked) payload.kind = 'deploy';
      if (noDeployCheck.checked) payload.noDeploy = true;
      api('/api/mesh/task', payload).then(function (r) {
        if (!r) return;
        ov.close();
        if (DEMO) push();
        toast('Task created', 'success');
      });
    }
    var modeField = field('mode', 'Story mode', 'parallel = no auto deps, sequential = chain', modeSel);
    modeField.style.display = 'none';
    var ov = openDialog({
      wide: true, title: 'New task',
      body: [
        err,
        el('div', { class: 'form-grid' },
          el('div', { class: 'full' }, field('title', 'Title', null, titleIn)),
          el('div', { class: 'full' }, field('brief', 'Instructions for the agent', 'The agent sees only this - Ctrl+Enter to create (optional for story)', briefIn)),
          field('assignee', 'Assign to', 'empty = any waiting worker - known ids are suggested', assigneeIn),
          field('workspacePath', 'Project folder', 'defaults to the newest task folder', wsIn),
          field('type', 'Type', null, typeSel),
          field('priority', 'Priority', null, prioritySel),
          el('div', { class: 'full' }, field('labels', 'Labels', 'comma separated, max 5, slug [a-z0-9-]', labelsIn)),
          modeField,
          el('div', { class:'full' }, subtaskContainer),
          field('allowedFiles', 'Files it may change', 'one per line', allowedIn),
          field('forbiddenFiles', 'Files it must never touch', 'one per line', forbiddenIn),
          el('div', { class: 'full' }, field('acceptance', 'Done when', 'one per line', acceptIn)),
          el('div', { class: 'full' }, el('div', { style:{display:'flex',gap:'12px',flexWrap:'wrap'} },
            el('label', { class:'check' }, deployCheck, el('span', { text:'Deployment task' })),
            el('label', { class:'check' }, noDeployCheck, el('span', { text:'No deployment needed' }))))
        )
      ],
      foot: [
        el('button', { class: 'btn', text: 'Cancel', onclick: function () { ov.close(); } }),
        el('button', { class: 'btn primary', text: 'Create task', onclick: submit })
      ]
    });
    updateStoryVisibility();
    titleIn.focus();
  }

  /* 8. agent popup */

  function openHandover(taskId){
    var t = taskById(taskId);
    if (!t) { toast('Unknown task '+taskId,'error'); return; }
    var holderId = t.assignedIDE || t.assignee || '';
    var holderName = holderId ? agentName(holderId) : 'none';
    var filesN = (t.filesModified && t.filesModified.length) || 0;
    var isInProgress = t.status==='claimed' || t.status==='in_progress' || t.status==='blocked';
    var allAgents = workers().slice();
    allAgents.sort(function(a,b){
      var sa = agentStateOf(a.id), sb = agentStateOf(b.id);
      var order = {idle:0,busy:1,offline:2};
      return (order[sa]||2)-(order[sb]||2) || agentName(a.id).localeCompare(agentName(b.id));
    });
    var selectedTo = '';
    var noteIn = el('textarea', { rows:'3', placeholder:'Optional note for next agent...', 'aria-label':'Handover note' });

    var list = el('div', { class:'handover-list' });
    function renderList(){
      var nodes = [];
      var openItem = el('div', { class:'handover-item'+(selectedTo===''?' selected':''), tabindex:'0', role:'button',
        onclick:function(){ selectedTo=''; renderList(); },
        onkeydown:function(e){ if(e.key==='Enter'){ selectedTo=''; renderList(); } }
      }, el('span', { class:'h-state idle' }), el('span', { text:'Open to any worker' }));
      nodes.push(openItem);
      allAgents.forEach(function(a){
        var av = agentStateOf(a.id);
        var item = el('div', { class:'handover-item'+(selectedTo===a.id?' selected':''), tabindex:'0', role:'button',
          onclick:(function(id){ return function(){ selectedTo=id; renderList(); }; })(a.id),
          onkeydown:(function(id){ return function(e){ if(e.key==='Enter'){ selectedTo=id; renderList(); } }; })(a.id)
        },

      title:'Hand over '+t.id,

          el('div', { class:'meta' }, el('b',{text:'Status'}), el('span',{text: STATUS_LABEL[t.status]||t.status })),
          el('div', { class:'meta' }, el('b',{text:'Files changed'}), el('span',{text: String(filesN)}))
        ),

        el('div', { class:'section' }, el('h3',{text:'Choose next worker'}), list),

          var payload = { to: selectedTo, note: noteIn.value };
          api('/api/mesh/task/'+encodeURIComponent(t.id)+'/handover', payload).then(function(r){
            if (r){ ov.close(); if (DEMO) push(); toast('Handed over '+t.id,'success'); closeTask(); }
          });
        }})

    });
  }

            m.appendChild(workloadBar(a.id));

            return m;
          })()),
        el('div', { class: 'section' }, el('h3', { text: 'Display name' }), renameIn,
          el('div', { class: 'muted', text: 'Empty value resets to the id. The name is used everywhere the agent appears.' })),
        !a.manual ? el('div', { class: 'section' }, el('h3', { text: 'Start prompt for this agent' }),
          el('div', { class: 'pre', text: startPromptFor(a.id) }),
          el('button', { class: 'btn small', text: 'Copy start prompt', onclick: function () { copyText(startPromptFor(a.id), 'Start prompt'); } })) : null,
        cur ? el('div', { class: 'section' }, el('h3', { text: 'Currently working on' }),
          el('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } },
            el('button', { class: 'need', style: { maxWidth: '100%' }, text: cur.id + ' — ' + cur.title, onclick: function () { openTask(cur.id); } }),
            el('span', { class: 'timer badge time', title: 'time in ' + STATUS_LABEL[cur.status] }, timerNode(cur, { staleAt: 30 * 60000 })))) : null,
        el('div', { class: 'section' }, el('h3', { text: 'Tasks' }),
          myTasksView(a.id))
      );
    }
    function myTasksView(agentId) {
      var mine = S.tasks.filter(function (t) { return (t.assignee || t.assignedIDE) === agentId; });
      if (!mine.length) return el('div', { class: 'muted', text: 'No tasks assigned.' });
      var order = ['blocked', 'review', 'pending_deploy', 'in_progress', 'claimed', 'backlog', 'done', 'cancelled'];
      var groups = {};
      mine.forEach(function (t) { (groups[t.status] = groups[t.status] || []).push(t); });
      return el('div', { class: 'section' }, order.filter(function (s) { return groups[s]; }).map(function (s) {

            });

    }

  }

  /* 9. move menu (keyboard equivalent of drag & drop) */
  function movesFor(t) {
    var out = [];
    if (t.status === 'done' || t.status === 'cancelled') return out;
    var manual = isManual(t.assignee || t.assignedIDE);
    if (manual) {   // a manual agent's task is mine to move by hand
      var opts = [['backlog', 'Waiting'], ['in_progress', 'Working'], ['review', 'In review'], ['pending_deploy', 'Pending deployment'], ['done', 'Done'], ['cancelled', 'Cancelled']];
      opts.forEach(function (o) {
        if (o[0] === t.status) return;
        out.push({ label: 'Move to ' + o[1], run: function () { moveTask(t, o[0]); } });
      });
      return out;
    }
    if (t.status === 'review') {
      out.push({ label: 'Approve → Pending', run: function () { approveTask(t); } });
      out.push({ label: 'Approve without deploying → Done', run: function () { approveWithoutDeploy(t); } });
      out.push({ label: 'Send back → Waiting', run: function () { openTask(t.id, { sendBack: true }); } });
    }
    if (t.status === 'pending_deploy') {
      out.push({ label: 'Mark deployed → Done', run: function(){ markDeployed(t); } });
    }
    if (t.status === 'backlog') {
      workers().forEach(function (a) {
        out.push({ label: 'Assign to ' + agentName(a.id), run: function () { reassign(t, a.id); } });
      });
      if (t.assignee) out.push({ label: 'Unassign', run: function () { reassign(t, ''); } });
      runnableAgents().forEach(function (a) {
        out.push({ label: '▶ Run ' + (a.launch ? a.launch.label : a.id) + ' now', run: function () { runAgent(a.id); } });
      });

  /* 10. drag & drop */
  var dragTask = null;
  function dropAction(t, rawZone, agentId) {
    var s = t.status;
    var zone = rawZone.indexOf('col:') === 0 ? rawZone.slice(4) : rawZone; // "col:working" -> "working"
    var manual = isManual(t.assignee || t.assignedIDE);
    if (s === 'done') return { ok: false, why: "Done tasks can't be moved" };
    if (s === 'cancelled') return { ok: false, why: "Cancelled tasks can't be moved" };
    if (zone === 'cancel') return { ok: true, kind: 'cancel' };
    if (zone === 'agent') {
      if (manual) return { ok: false, why: 'A manual task has no agent working in your repo — move it between columns instead' };
      if (s !== 'backlog') return { ok: false, why: 'Only waiting tasks can be reassigned — this one is already in the agent’s hands' };
      if ((t.assignee || '') === agentId) return { ok: false, why: 'Already assigned to ' + agentName(agentId) };
      return { ok: true, kind: 'assign', agentId: agentId };
    }
    if (manual) {   // Waiting / Working / In review / Pending / Done belong to me for manual agents
      if (zone === 'blocked') return { ok: false, why: 'Only an agent can ask a question — a manual task never goes here' };
      if (zone === 'backlog') return s === 'backlog' ? { ok: false, why: 'Already waiting' } : { ok: true, kind: 'move', to: 'backlog' };
      if (zone === 'working') return s === 'in_progress' ? { ok: false, why: 'Already in Working' } : { ok: true, kind: 'move', to: 'in_progress' };
      if (zone === 'review') return s === 'review' ? { ok: false, why: 'Already in review' } : { ok: true, kind: 'move', to: 'review' };
      if (zone === 'pending_deploy') return s === 'pending_deploy' ? { ok: false, why: 'Already pending deployment' } : { ok: true, kind: 'move', to: 'pending_deploy' };
      if (zone === 'done') return { ok: true, kind: 'move', to: 'done' };
      if (zone === 'cancelled') return { ok: true, kind: 'move', to: 'cancelled' };
      return { ok: false, why: 'That column is not part of the manual flow' };
    }
    // real agent tasks
    if (s === 'pending_deploy') {
      if (zone === 'done') return { ok: true, kind: 'deployed' };
      return { ok: false, why: 'Pending deployment tasks can only be marked deployed (drag to Done) or cancelled' };
    }
    if (s === 'review') {
      if (zone === 'pending_deploy') return { ok: true, kind: 'approve' };
      if (zone === 'done') return { ok: true, kind: 'approve_no_deploy' };
    }
    if (zone === 'done') return s === 'review' ? { ok: true, kind: 'approve' } : { ok: false, why: 'Only review tasks can be approved — the agent has to finish the work first' };
    if (zone === 'pending_deploy') return s === 'review' ? { ok: true, kind: 'approve' } : { ok: false, why: 'Only review tasks can go to pending deployment' };
    if (zone === 'working') return s === 'review' ? { ok: true, kind: 'sendback' } : { ok: false, why: 'Only the agent can start work — assign it instead' };
    if (zone === 'backlog') return { ok: false, why: 'Waiting is where new tasks start — assign it to an agent instead' };
    if (zone === 'review') return { ok: false, why: 'The agent finishes the work — drag to Pending or Done to approve it' };
    if (zone === 'blocked') return { ok: false, why: 'The agent marks itself blocked when it has a question' };
    return { ok: false, why: 'The board columns follow the agent’s progress, not your drags' };
  }

  var actions = ['claim','progress','review','approve','deployed','move','blocked','answer','created'];

    return done({}, 'manager', 'agent', 'Renamed ' + id + ' to ' + (ag.displayName || id) + '.', 'info');
  }
  if (parts[2] === 'agent' && verb === 'remove'){
    var ag = agentById(id);
    if (!ag) return fail('Unknown agent ' + id);
    if (ag.role==='MANAGER') return fail('Manager cannot be removed');
    var transferTo = body.transferTo || '';
    // transfer tasks
    S.tasks.forEach(function(t){
      if (t.assignee===id) t.assignee = transferTo || null;
      if (t.assignedIDE===id) t.assignedIDE = null;
      if (transferTo && (t.assignee===transferTo || !t.assignee)) {
        // keep as is, if transferTo empty, open to any worker
      }
      if (!transferTo) {
        if (t.assignee===null) t.status = t.status==='backlog' ? 'backlog' : 'todo';
      }
    });
    S.agents = S.agents.filter(function(a){ return a.id!==id; });
    if (S.agentState) delete S.agentState[id];
    return done({}, 'manager', 'agent', 'Removed ' + id + (transferTo ? ', tasks moved to ' + transferTo : ', tasks opened'), 'success');
  }
  if (parts[2] === 'rejected' && verb === 'dismiss'){
    var rid = body.id || id;
    S.rejected = (S.rejected||[]).filter(function(r){ return r.id!==rid; });
    // also remove related attention
    S.attention = (S.attention||[]).filter(function(it){ return !(it.kind==='rejected' && it.message && it.message.indexOf(rid)>=0); });
    return done({}, 'manager', 'rejected', 'Dismissed ' + rid, 'info');
  }
  if (parts[2] === 'rejected' && parts.length===3 && method!=='GET'){
    // POST /api/mesh/rejected/dismiss {id}
    var rid2 = body.id || '';
    S.rejected = (S.rejected||[]).filter(function(r){ return r.id!==rid2; });
    S.attention = (S.attention||[]).filter(function(it){ return !(it.kind==='rejected' && it.message && it.message.indexOf(rid2)>=0); });
    return done({}, 'manager', 'rejected', 'Dismissed ' + rid2, 'info');
  }

  if (parts[2] === 'task' && verb === 'move'){
    if (!isManual(t.assignee || t.assignedIDE)) return fail('Only a manual agent’s task can be moved by hand — this one belongs to a real agent');
    if (['backlog', 'todo', 'in_progress', 'review', 'pending_deploy', 'done', 'cancelled'].indexOf(body.to) < 0) return fail('Unknown column');
    if (t.status === body.to) return fail('Already there');
    t.status = body.to; t.updatedAt = new Date().toISOString();
    if (body.to === 'backlog') { t.deliverable = ''; t.progressLog.push({ at:t.updatedAt, status:'backlog', summary:'Moved back to Waiting by the manager.' }); }
    if (body.to === 'done') t.progressLog.push({ at:t.updatedAt, status:'done', summary:'Moved to Done by the manager.' });
    if (body.to === 'in_progress') t.progressLog.push({ at:t.updatedAt, status:'in_progress', summary:'Moved to Working by the manager.' });
    if (body.to === 'review') t.progressLog.push({ at:t.updatedAt, status:'review', summary:'Moved to review by the manager.' });
    if (body.to === 'pending_deploy') t.progressLog.push({ at:t.updatedAt, status:'pending_deploy', summary:'Moved to Pending deployment by the manager.' });
    if (body.to === 'cancelled') t.changesSummary = 'Cancelled by the manager.';
    return done({}, 'manager', 'move', t.id + ' → ' + body.to + ' (manual task).', 'info');
  }
  if (parts[2] === 'task' && verb === 'handover'){
    var to = body.to || '';
    var note = body.note || '';
    if (to) {
      t.assignee = to;
      t.assignedIDE = null;
    } else {
      t.assignee = null;
      t.assignedIDE = null;
    }
    t.status = 'todo';
    t.updatedAt = new Date().toISOString();
    t.progressLog = t.progressLog || [];
    t.progressLog.push({ at:t.updatedAt, status:'todo', summary:'Handed over to '+(to||'any worker')+(note ? ': '+note : '') });
    S.handoverHints = (S.handoverHints||[]).filter(function(h){ return h.taskId!==t.id; });
    return done({}, 'manager', 'handover', 'Handed over '+t.id+' to '+(to||'any worker')+'.', 'info');
  }
  if (parts[2] === 'agent' && verb === 'runner' && parts[5]==='start'){
    var ag = agentById(id);
    if (!ag) return fail('Unknown agent '+id);
    ag.runner = ag.runner || {};
    ag.runner.running = true;
    ag.runner.pid = Math.floor(Math.random()*10000)+1000;
    ag.runner.startedAt = new Date().toISOString();
    ag.runner.lastExit = null;
    return done({}, 'manager', 'runner', 'Runner started for '+id, 'success');
  }
  if (parts[2] === 'agent' && verb === 'runner' && parts[5]==='stop'){
    var ag = agentById(id);
    if (!ag) return fail('Unknown agent '+id);
    ag.runner = ag.runner || {};
    ag.runner.running = false;
    ag.runner.pid = null;
    ag.runner.lastExit = {code:0,at:new Date().toISOString()};
    return done({}, 'manager', 'runner', 'Runner stopped for '+id, 'info');
  }
  if ((parts[2]==='rejected' && parts[3]==='dismiss') || (parts[2]==='rejected' && id==='dismiss')){
    var rid3 = body.id || '';
    if (!rid3 && parts[2]==='rejected' && parts[3] && parts[3]!=='dismiss') rid3 = parts[3];
    S.rejected = (S.rejected||[]).filter(function(r){ return r.id!==rid3; });
    S.attention = (S.attention||[]).filter(function(it){ return !(it.kind==='rejected' && it.message && it.message.indexOf(rid3)>=0); });
    return done({}, 'manager', 'rejected', 'Dismissed ' + rid3, 'info');
  }
  if (parts[2] === 'release-lock'){
    S.locks = S.locks.filter(function (l) { return l.filePath !== body.filePath; });
    return done({}, 'manager', 'lock', 'Released the lock on ' + body.filePath + '.', 'info');
  }
  if (path.indexOf('/api/mesh/history')===0 || (parts[1]==='mesh' && parts[2] && parts[2].indexOf('history')===0)){
    // GET /api/mesh/history?limit=200&offset=0&agent=&q=
    var q = '';
    var limit = 200, offset = 0, agent = '';
    try {
      var url = new URL('http://x'+path);
      limit = parseInt(url.searchParams.get('limit')||'200',10);
      offset = parseInt(url.searchParams.get('offset')||'0',10);
      agent = url.searchParams.get('agent')||'';
      q = (url.searchParams.get('q')||'').toLowerCase();
    } catch(e){
      // fallback parse
      var m = path.match(/limit=(\d+)/); if (m) limit = parseInt(m[1],10);
      m = path.match(/offset=(\d+)/); if (m) offset = parseInt(m[1],10);
      m = path.match(/agent=([^&]*)/); if (m) agent = decodeURIComponent(m[1]);
      m = path.match(/q=([^&]*)/); if (m) q = decodeURIComponent(m[1]).toLowerCase();
    }
    var all = demoHistoryEvents();
    var filtered = all.filter(function(ev){
      if (agent && ev.ideName !== agent && ev.ideName !== agentName(agent) && ev.ideName !== agent) {
        // allow filter by agent id or display name
        var ag = agentById(agent);
        if (!ag) return false;
        if (ev.ideName !== ag.id && ev.ideName !== (ag.displayName||'')) return false;
      }
      if (q) {
        var hay = (ev.message+' '+ev.action+' '+ev.ideName).toLowerCase();
        if (hay.indexOf(q)<0) return false;
      }
      return true;
    });
    var slice = filtered.slice(offset, offset+limit);
    return Promise.resolve({ total: filtered.length, events: slice });
  }
  return fail('Unsupported request in demo mode');
}

  /* 13. top bar wiring + boot */
  function enterDemo() {
    if (DEMO) return;
    DEMO = true;
    if (reconnectTimer) { window.clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) { } ws = null; }
    $('#demoBadge').classList.remove('hidden');
    setConn('live', 'demo');
    toast('Demo mode: sample data, nothing is connected to a daemon.', 'warn');
    UI.forceBoard = false;
    applyState(demoState());
  }
  function applyDensity() { document.body.classList.toggle('compact', !!UI.compact); }
  function applyTheme() {
    var root = document.documentElement;
    if (UI.theme === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', UI.theme);
    var b = $('#themeBtn');
    b.textContent = UI.theme === 'light' ? '☀' : UI.theme === 'dark' ? '☾' : '◐';
    b.setAttribute('aria-label', 'Theme: ' + UI.theme + ' (click to change)');
    b.title = 'Theme: ' + UI.theme;
  }
  function applyGroup() {
    $('#groupStatus').setAttribute('aria-pressed', UI.groupBy === 'status' ? 'true' : 'false');
    $('#groupAgent').setAttribute('aria-pressed', UI.groupBy === 'agent' ? 'true' : 'false');
    var gs = $('#groupStory'); if (gs) gs.setAttribute('aria-pressed', UI.groupBy === 'story' ? 'true' : 'false');
    setText($('#boardHint'), UI.groupBy === 'agent' ? 'Swimlanes per agent' : UI.groupBy === 'story' ? 'Lanes per story' : '');
  }
  var searchTimer = null;
  function wire() {
    $('#search').value = UI.search;
    $('#search').addEventListener('input', function (e) {
      var v = e.target.value;
      window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(function () { UI.search = v; saveUI(); render(); }, 160);
    });
    $('#agentFilter').addEventListener('change', function (e) { UI.filterAgent = e.target.value; saveUI(); render(); });
    $('#showCancelled').addEventListener('change', function (e) { UI.showCancelled = e.target.checked; saveUI(); render(); });
    var ct = $('#compactToggle'); if (ct) { ct.addEventListener('change', function(e){ UI.compact = e.target.checked; try { window.localStorage.setItem(PREF_KEY, JSON.stringify({ avatars: AV, compact: !!UI.compact })); } catch(err){} applyDensity(); }); }
    // main tabs
    var mainTabsEl = $('#mainTabs');
    if (mainTabsEl){
      var tabBtns = mainTabsEl.querySelectorAll('[role=tab]');
      for (var ti=0; ti<tabBtns.length; ti++){
        (function(btn){
          btn.addEventListener('click', function(){ setMainTab(btn.dataset.tab); });
          btn.addEventListener('keydown', function(e){
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
              e.preventDefault();
              var tabs = Array.prototype.slice.call(mainTabsEl.querySelectorAll('[role=tab]'));
              var idx = tabs.indexOf(btn);
              var nextIdx = e.key === 'ArrowRight' ? (idx+1)%tabs.length : (idx-1+tabs.length)%tabs.length;
              tabs[nextIdx].focus();
              setMainTab(tabs[nextIdx].dataset.tab);
            }
          });
        })(tabBtns[ti]);
      }
    }
    var archiveSearchEl = $('#archiveSearch');
    if (archiveSearchEl){
      archiveSearchEl.addEventListener('input', function(e){
        UI.archiveSearch = e.target.value;
        try { saveUI(); } catch(err){}
        renderArchive();
      });
    }
    var showCancelledArchiveEl = $('#showCancelledArchive');
    if (showCancelledArchiveEl){
      showCancelledArchiveEl.addEventListener('change', function(e){
        UI.showCancelled = e.target.checked;
        var sc = $('#showCancelled');
        if (sc) sc.checked = e.target.checked;
        saveUI();
        renderArchive();
        renderBoard();
      });
    }
    // keep old showCancelled in sync if present
    var scOld = $('#showCancelled');
    if (scOld){
      scOld.addEventListener('change', function(e){
        UI.showCancelled = e.target.checked;
        var sca = $('#showCancelledArchive');
        if (sca) sca.checked = e.target.checked;
        saveUI();
        renderBoard();
        renderArchive();
      });
    }

    $('#newTaskBtn').addEventListener('click', openNewTask);
    $('#settingsBtn').addEventListener('click', function () { openSettings('team'); });
    var locksBtn = $('#locksBtn');
    if (locksBtn) locksBtn.addEventListener('click', function(){ openSettings('locks'); });
    var railToggle = $('#railToggle');
    if (railToggle) railToggle.addEventListener('click', function(){ toggleRail(); });
    $('#themeBtn').addEventListener('click', function () {
      UI.theme = UI.theme === 'auto' ? 'light' : UI.theme === 'light' ? 'dark' : 'auto';
      saveUI(); applyTheme();
    });
    $('#groupStatus').addEventListener('click', function () { UI.groupBy = 'status'; saveUI(); applyGroup(); render(); });
    $('#groupAgent').addEventListener('click', function () { UI.groupBy = 'agent'; saveUI(); applyGroup(); render(); });
    var gStory = $('#groupStory'); if (gStory) gStory.addEventListener('click', function () { UI.groupBy = 'story'; saveUI(); applyGroup(); render(); });
    $('#activityToggle').addEventListener('click', function () { UI.activity = !UI.activity; saveUI(); renderActivity(); });
    $('#activityClose').addEventListener('click', function () { UI.activity = false; saveUI(); renderActivity(); });
    var ab = $('#activityBackdrop');
    if (ab) ab.addEventListener('click', function(){ UI.activity=false; saveUI(); renderActivity(); });
    var attBtn = $('#attentionBtn');
    if (attBtn) attBtn.addEventListener('click', function(){ UI.attention = !UI.attention; saveUI(); renderAttention(); });
    var attClose = $('#attentionClose');
    if (attClose) attClose.addEventListener('click', function(){ UI.attention=false; saveUI(); renderAttention(); });
    var attBack = $('#attentionBackdrop');
    if (attBack) attBack.addEventListener('click', function(){ UI.attention=false; saveUI(); renderAttention(); });
    document.addEventListener('visibilitychange', refreshTimes);
    // apply initial rail state
    document.body.classList.toggle('rail-collapsed', !!UI.railCollapsed);
    document.body.classList.toggle('rail-expanded', !UI.railCollapsed);
  
    var viewBtn = $('#viewMenuBtn');
    if (viewBtn){
      viewBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var items = [];
        items.push({ label: 'Group: Status', run: function(){ UI.groupBy='status'; saveUI(); applyGroup(); render(); } });
        items.push({ label: 'Group: Agent', run: function(){ UI.groupBy='agent'; saveUI(); applyGroup(); render(); } });
        items.push({ label: 'Group: Story', run: function(){ UI.groupBy='story'; saveUI(); applyGroup(); render(); } });
        items.push({ label: (UI.compact?'Disable Compact':'Enable Compact'), run: function(){ UI.compact=!UI.compact; try { window.localStorage.setItem(PREF_KEY, JSON.stringify({ avatars: AV, compact: !!UI.compact })); } catch(err){} applyDensity(); } });
        items.push({ label: (UI.showCancelled?'Hide cancelled':'Show cancelled'), run: function(){ UI.showCancelled=!UI.showCancelled; saveUI(); renderBoard(); renderArchive(); } });
        openMenu(viewBtn, 'View options', items);
      });
    }

}
  loadUI();
  loadPrefs();
  applyTheme();
  applyDensity();
  applyGroup();
  initStrip();
  wire();
  var scInit = $('#showCancelled'); if (scInit) scInit.checked = !!UI.showCancelled;
  var ct2 = $('#compactToggle'); if (ct2) ct2.checked = !!UI.compact;
  var scaInit = $('#showCancelledArchive'); if (scaInit) scaInit.checked = !!UI.showCancelled;
  var asInit = $('#archiveSearch'); if (asInit) asInit.value = UI.archiveSearch||'';
  // set initial main tab attr
  document.body.setAttribute('data-main-tab', UI.mainTab || 'board');
  renderMainTabs();
  if (DEMO) {
    $('#demoBadge').classList.remove('hidden');
    setConn('live', 'demo');
    applyState(demoState());
  } else if (loaded) {
    setConn('', 'connecting…');
    render();
    connect();
  } else {
    setConn('', 'connecting…');
    // skeleton already rendered, keep it until first MESH_INIT
    try {
      if (!skeletonRendered) renderSkeleton();
    } catch(e){}
    connect();
  }

  window.addEventListener('resize', function () { if (window.innerWidth > 1200) { $('#activity').classList.toggle('open', !!UI.activity); } });
  // expose a couple of internals for manual debugging only
  window.AgentMesh = { get state() { return S; }, render: render };
})();
</script>
</body>
